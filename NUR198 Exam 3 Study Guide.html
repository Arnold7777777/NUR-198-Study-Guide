  <iframe class="tf show" data-tab="kcrs" src="NUR198%20Exam%203%20KCRs.html" loading="eager"></iframe>

</div>
<script>
 var tabs=document.querySelectorAll('.tab'), frames=document.querySelectorAll('.tf');
 tabs.forEach(function(t){t.addEventListener('click',function(){
   var id=t.dataset.tab;
   tabs.forEach(function(x){x.classList.toggle('active',x===t);});
   frames.forEach(function(f){f.classList.toggle('show',f.dataset.tab===id);});
 });});
 (function(){
   var b=document.getElementById('hdrToggle'), K='e3HdrCollapsed';
   function set(on,save){
     document.body.classList.toggle('hdr-collapsed',on);
     b.textContent = on ? '\u2304' : '\u2303';
     b.setAttribute('aria-expanded', on ? 'false' : 'true');
     b.title = on ? 'Show the title bar' : 'Hide the title bar';
     if(save){ try{ localStorage.setItem(K, on?'1':'0'); }catch(e){} }
   }
   var saved=null; try{ saved=localStorage.getItem(K); }catch(e){}
   set(saved==='1', false);
   b.addEventListener('click',function(){ set(!document.body.classList.contains('hdr-collapsed'), true); });
 })();
</script>

<script id="a11yJS">
/* a table wider than the screen scrolls inside its own box rather than dragging
   the whole page sideways */
(function(){
  function wrap(){
    document.querySelectorAll('table').forEach(function(t){
      var p=t.parentNode;
      if(!p||p.classList&&p.classList.contains('a11y-tblwrap'))return;
      var d=document.createElement('div'); d.className='a11y-tblwrap';
      p.insertBefore(d,t); d.appendChild(t);
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wrap);
  else wrap();
  setTimeout(wrap,1200);   /* catch tables built by the page's own scripts */
})();
</script>
