  <iframe class="tf" data-tab="guide" src="NUR198%20Exam%203%20Guide%20and%20Quiz.html" loading="lazy"></iframe>
</div>
<script>
(function(){
 var tabs   = document.querySelectorAll('.tab'),
     minis  = document.querySelectorAll('.minitab'),
     frames = document.querySelectorAll('.tf'),
     K = 'e3ChromeCollapsed';

 function selectTab(id){
   tabs.forEach(function(x){ x.classList.toggle('active', x.dataset.tab===id); });
   minis.forEach(function(x){ x.classList.toggle('mtActive', x.dataset.tab===id); });
   frames.forEach(function(f){ f.classList.toggle('show', f.dataset.tab===id); });
   applyFrames(document.body.classList.contains('all-collapsed'));
 }
 tabs .forEach(function(t){ t.addEventListener('click', function(){ selectTab(t.dataset.tab); }); });
 minis.forEach(function(t){ t.addEventListener('click', function(){ selectTab(t.dataset.tab); }); });

 /* The inner pages are same-origin, so the wrapper can hide their own menu bar
    directly. Wrapped in try/catch in case a page is ever served cross-origin. */
 function applyFrames(on){
   frames.forEach(function(f){
     try{
       var d = f.contentDocument;
       if(d && d.body) d.body.classList.toggle('e3-chrome-hidden', on);
     }catch(e){}
   });
 }
 frames.forEach(function(f){
   f.addEventListener('load', function(){
     applyFrames(document.body.classList.contains('all-collapsed'));
   });
 });

 var b = document.getElementById('hdrToggle'),
     x = document.getElementById('miniExpand');
 function set(on, save){
   document.body.classList.toggle('all-collapsed', on);
   b.setAttribute('aria-expanded', on ? 'false' : 'true');
   b.title = on ? 'Show the bars again' : 'Hide every bar';
   applyFrames(on);
   if(save){ try{ localStorage.setItem(K, on ? '1' : '0'); }catch(e){} }
 }
 var saved = null; try{ saved = localStorage.getItem(K); }catch(e){}
 set(saved === '1', false);

 b.addEventListener('click', function(){ set(true,  true); });
 x.addEventListener('click', function(){ set(false, true); });
 document.addEventListener('keydown', function(e){
   if(e.key === 'Escape' && document.body.classList.contains('all-collapsed')) set(false, true);
 });

 /* iframes that were already loaded before this script ran */
 setTimeout(function(){ applyFrames(document.body.classList.contains('all-collapsed')); }, 400);
})();
</script>

<script id="a11yJS">
/* a table wider than the screen scrolls inside its own box rather than dragging
   the whole page sideways */
(function(){
  function wrap(){
    document.querySelectorAll('table').forEach(function(t){
      var p=t.parentNode;
      if(!p||p.classList&&p.classList.contains('a11y-tblwrap'))return;
      var d=document.createElement('div'); d.className='a11y-tblwrap';
      p.insertBefore(d,t); d.appendChild(t);
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wrap);
  else wrap();
  setTimeout(wrap,1200);   /* catch tables built by the page's own scripts */
})();
</script>
