      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Anticoagulants &amp;amp; Thrombolytics (PE/DVT)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Anticoagulants &amp;amp; Thrombolytics (PE/DVT)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Heparin (IV) · Enoxaparin (LMWH, SubQ) · Warfarin (PO) · Alteplase (tPA)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Heparin/enoxaparin: potentiate antithrombin → prevent clot extension (don’t dissolve).&lt;/li&gt;&lt;li&gt;Warfarin: blocks vitamin K clotting factors (slow onset).&lt;/li&gt;&lt;li&gt;Alteplase: dissolves an existing clot — emergency, massive PE.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;PE &amp;amp; DVT treatment and prevention.&lt;/li&gt;&lt;li&gt;Alteplase: life-threatening PE with instability.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;BLEEDING (all).&lt;/li&gt;&lt;li&gt;Heparin: HIT (heparin-induced thrombocytopenia).&lt;/li&gt;&lt;li&gt;Warfarin: many interactions; teratogenic.&lt;/li&gt;&lt;li&gt;Alteplase: major hemorrhage risk.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Heparin: monitor aPTT (1.5–2.5×); antidote PROTAMINE SULFATE.&lt;/li&gt;&lt;li&gt;Warfarin: monitor INR (target ~2–3); antidote VITAMIN K.&lt;/li&gt;&lt;li&gt;Enoxaparin: SubQ, don’t expel the bubble, don’t aspirate/rub.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Active bleeding, recent surgery, ACTIVE PEPTIC ULCER, hemorrhagic stroke.&lt;/li&gt;&lt;li&gt;Alteplase: many absolute contraindications (recent bleed/stroke).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;NSAIDs/aspirin ↑ bleeding.&lt;/li&gt;&lt;li&gt;Warfarin: vitamin K foods, antibiotics, many drugs alter INR.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bleeding precautions: soft toothbrush, electric razor, report bruising/blood.&lt;/li&gt;&lt;li&gt;Warfarin: keep vitamin K (leafy greens) CONSISTENT, regular INR labs.&lt;/li&gt;&lt;li&gt;Don’t take with NSAIDs unless told.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; No new clot/extension, no PE recurrence; labs in target range.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; EXAM TRAP — active peptic ulcer is a CONTRAINDICATION to heparin (GI bleed). A PRIOR DVT is NOT a contraindication — it’s the reason for the drug. Heparin antidote = protamine; warfarin antidote = vitamin K.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-abx&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Anti-Infectives (Pneumonia / Respiratory Infection)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Anti-Infectives (Pneumonia / Respiratory Infection)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Ceftriaxone · Azithromycin · Levofloxacin · Vancomycin · Oseltamivir (antiviral)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Ceftriaxone (cephalosporin): cell-wall inhibition.&lt;/li&gt;&lt;li&gt;Azithromycin (macrolide), Levofloxacin (fluoroquinolone): protein/DNA inhibition.&lt;/li&gt;&lt;li&gt;Vancomycin: for MRSA / resistant organisms.&lt;/li&gt;&lt;li&gt;Oseltamivir: antiviral — shortens influenza if started early.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Community- &amp;amp; hospital-acquired pneumonia; influenza (oseltamivir).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;GI upset; allergy (penicillin cross-reactivity w/ cephalosporins).&lt;/li&gt;&lt;li&gt;Levofloxacin: TENDON rupture, QT prolongation, photosensitivity.&lt;/li&gt;&lt;li&gt;Vancomycin: nephrotoxic/ototoxic; “RED MAN” if infused too fast.&lt;/li&gt;&lt;li&gt;C. difficile risk with broad-spectrum use.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;GET SPUTUM CULTURE BEFORE first antibiotic dose.&lt;/li&gt;&lt;li&gt;Vancomycin: infuse slowly (≥60 min), monitor trough levels.&lt;/li&gt;&lt;li&gt;Oseltamivir: start within 48 hr of flu symptoms.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Known drug allergy; renal caution (vancomycin, levofloxacin).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Many; check QT-prolonging combos; warfarin interactions.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Finish the full course.&lt;/li&gt;&lt;li&gt;Take probiotics/yogurt as advised; report watery diarrhea.&lt;/li&gt;&lt;li&gt;Levofloxacin: report tendon pain; use sun protection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Fever/WBC normalize, cough improves, clearer lungs, negative repeat cultures.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; #1 action: sputum culture BEFORE antibiotics. Vancomycin given too fast → Red Man Syndrome (flushing) — slow the infusion.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-upper&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Upper-Respiratory &amp;amp; Cough Agents&lt;/h2&gt;&lt;/div&gt;

      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Upper-Respiratory &amp;amp; Cough Agents&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Pseudoephedrine (decongestant) · Diphenhydramine (antihistamine) · Guaifenesin (expectorant) · Dextromethorphan &amp;amp; Codeine (antitussives)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Decongestant: vasoconstriction → ↓ nasal swelling.&lt;/li&gt;&lt;li&gt;Antihistamine: blocks histamine → ↓ secretions/allergy.&lt;/li&gt;&lt;li&gt;Expectorant: thins mucus → easier to cough up.&lt;/li&gt;&lt;li&gt;Antitussive: suppresses cough reflex.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Nasal congestion, allergic rhinitis, productive vs. dry cough.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pseudoephedrine: ↑ HR/BP, insomnia, jitteriness.&lt;/li&gt;&lt;li&gt;Diphenhydramine: SEDATION, anticholinergic (dry mouth, urinary retention).&lt;/li&gt;&lt;li&gt;Codeine: sedation, constipation, dependence.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Nasal decongestant SPRAYS: max 3–4 days (rebound congestion).&lt;/li&gt;&lt;li&gt;Take expectorant with plenty of water.&lt;/li&gt;&lt;li&gt;Avoid bedtime stimulants (pseudoephedrine).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pseudoephedrine: caution HTN, cardiac disease, hyperthyroidism.&lt;/li&gt;&lt;li&gt;Antihistamine caution: older adults (falls), BPH, glaucoma.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Decongestant + MAOIs → hypertensive crisis.&lt;/li&gt;&lt;li&gt;Additive CNS depression with other sedatives/opioids.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Increase fluids with guaifenesin.&lt;/li&gt;&lt;li&gt;Don’t exceed 3–4 days of decongestant spray.&lt;/li&gt;&lt;li&gt;Avoid driving on sedating antihistamines/codeine.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Less congestion, easier/looser cough, improved comfort &amp;amp; sleep.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; Topical decongestant &amp;gt; 3–4 days → rebound congestion (rhinitis medicamentosa). Diphenhydramine is high-risk in older adults.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-critical&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Epinephrine · Morphine · Nitroglycerin · Furosemide · Vecuronium/Pancuronium · Propofol · Fentanyl · Midazolam&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Epinephrine: α/β agonist → bronchodilation + vasoconstriction (anaphylaxis, severe asthma).&lt;/li&gt;&lt;li&gt;Furosemide: loop diuretic → removes fluid (pulmonary edema).&lt;/li&gt;&lt;li&gt;Nitroglycerin: vasodilator → ↓ preload.&lt;/li&gt;&lt;li&gt;Morphine: ↓ anxiety/preload/work of breathing.&lt;/li&gt;&lt;li&gt;Vecuronium/pancuronium: PARALYTICS (no sedation/analgesia).&lt;/li&gt;&lt;li&gt;Propofol/midazolam: sedation; fentanyl: analgesia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Anaphylaxis, status asthmaticus (epi); acute pulmonary edema (furosemide, nitro, morphine); ventilated ICU clients (sedation/paralysis).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Epinephrine: tachycardia, HTN, anxiety.&lt;/li&gt;&lt;li&gt;Furosemide: HYPOKALEMIA, dehydration, ototoxicity.&lt;/li&gt;&lt;li&gt;Opioids: respiratory depression.&lt;/li&gt;&lt;li&gt;Paralytics: total paralysis incl. breathing — patient is AWARE if not sedated.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Epinephrine anaphylaxis: IM into vastus lateralis.&lt;/li&gt;&lt;li&gt;Furosemide IV: push SLOWLY (ototoxicity).&lt;/li&gt;&lt;li&gt;Monitor K⁺ with furosemide.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Use paralytics only with airway control/ventilation.&lt;/li&gt;&lt;li&gt;Furosemide caution with low K⁺.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Additive CNS/respiratory depression (opioids+benzos).&lt;/li&gt;&lt;li&gt;Furosemide + digoxin → dig toxicity (low K⁺).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;(Mostly acute/ICU.) Teach EpiPen technique &amp;amp; to call 911 after use.&lt;/li&gt;&lt;li&gt;Daily weights/low-sodium for chronic furosemide.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Reversal of anaphylaxis/edema; on vents: adequate sedation, synchrony, target sats.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; CRITICAL — vecuronium/pancuronium PARALYZE but do NOT sedate. A paralyzed, unsedated patient is fully aware. ALWAYS pair a paralytic with sedation + analgesia.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-chemo&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Lung Cancer — Chemotherapy (Overview)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Lung Cancer — Chemotherapy (Overview)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Cisplatin / Carboplatin · (+ targeted &amp;amp; immunotherapy agents)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cytotoxic: damage DNA of rapidly dividing cells.&lt;/li&gt;&lt;li&gt;Targeted/immuno agents act on specific tumor markers.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Small-cell &amp;amp; advanced non-small-cell lung cancer.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cisplatin: NEPHROTOXICITY, ototoxicity, severe nausea, neuropathy.&lt;/li&gt;&lt;li&gt;Bone marrow suppression → ↓ WBC/RBC/platelets (infection, bleeding, anemia).&lt;/li&gt;&lt;li&gt;Alopecia, mucositis, fatigue.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Aggressive HYDRATION + antiemetics with cisplatin.&lt;/li&gt;&lt;li&gt;Handle per hazardous-drug protocol; monitor renal function &amp;amp; CBC.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Severe renal impairment (cisplatin); active infection; low counts.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Other nephrotoxic/ototoxic drugs (aminoglycosides) ↑ risk.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Infection precautions when counts are low (neutropenic).&lt;/li&gt;&lt;li&gt;Report fever ≥38°C, bleeding, hearing changes.&lt;/li&gt;&lt;li&gt;Nutrition &amp;amp; mouth care for mucositis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Tumor response on imaging; manageable side effects; counts recover between cycles.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; Neutropenia = highest priority — fever in a chemo patient is an emergency. Cisplatin needs hydration to protect the kidneys.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;section-divider&quot;&gt;&lt;h2 style=&quot;color:var(--gold);font-size:26px;border-bottom:3px solid var(--magenta);padding-bottom:10px;margin:30px 0 24px;&quot;&gt;🫀 System Disorders&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-rhinitis&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 4&lt;/div&gt;&lt;h2&gt;Rhinitis &amp;amp; Sinusitis&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Rhinitis &amp;amp; Sinusitis&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Inflammation of nasal mucosa (rhinitis) / sinuses (sinusitis); viral or allergic.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Mucosal inflammation → congestion, ↑ mucus; blocked sinus drainage → pressure/infection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hand hygiene, avoid allergens, annual flu vaccine, manage allergies.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Allergen/irritant exposure, viral URI.&lt;/li&gt;&lt;li&gt;Smoking, deviated septum, immunosuppression.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rhinitis: sneezing, clear rhinorrhea, congestion, itchy eyes.&lt;/li&gt;&lt;li&gt;Sinusitis: facial pain/pressure WORSE leaning forward, purulent drainage, headache, fever.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Usually clinical; allergy testing if allergic.&lt;/li&gt;&lt;li&gt;Sinus culture/CT if chronic/severe.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Clinical exam; nasal endoscopy or CT for chronic sinusitis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Promote drainage: fluids, steam, humidifier, HOB up.&lt;/li&gt;&lt;li&gt;Saline irrigation; warm compresses.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Antihistamines, intranasal glucocorticoids (allergic).&lt;/li&gt;&lt;li&gt;Decongestants (spray ≤3–4 days).&lt;/li&gt;&lt;li&gt;Antibiotics ONLY if bacterial sinusitis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Decongestant spray max 3–4 days (rebound).&lt;/li&gt;&lt;li&gt;Finish antibiotics; ↑ fluids.&lt;/li&gt;&lt;li&gt;Allergic: reduce triggers, use intranasal steroid daily.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Report stiff neck + high fever (possible meningitis). Avoid decongestants in uncontrolled HTN.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Sinusitis spread: orbital cellulitis, meningitis.&lt;/li&gt;&lt;li&gt;Chronic sinusitis; otitis media.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-pharyngitis&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 4&lt;/div&gt;&lt;h2&gt;Pharyngitis &amp;amp; Laryngitis &lt;span class=&quot;tag new&quot;&gt;NEW&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Pharyngitis &amp;amp; Laryngitis&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Inflammation of the pharynx (sore throat) / larynx (voice box).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Usually viral; pharyngitis can be group A strep (bacterial). Laryngitis = vocal cord inflammation/edema.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hand hygiene, avoid sharing utensils, don’t smoke, rest the voice.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Viral URI, strep exposure, vocal overuse, GERD, smoking.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pharyngitis: sore throat, red pharynx, fever, swollen nodes; strep = exudate.&lt;/li&gt;&lt;li&gt;Laryngitis: HOARSENESS, voice loss, throat dryness.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rapid strep test / throat culture for pharyngitis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Throat culture; laryngoscopy if hoarseness persists.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Warm saline gargles, throat lozenges, fluids, soft diet.&lt;/li&gt;&lt;li&gt;Humidify air; rest the voice.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Analgesics/antipyretics.&lt;/li&gt;&lt;li&gt;Antibiotics ONLY for strep (e.g., penicillin) — full course.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Finish the FULL antibiotic course (prevents rheumatic fever).&lt;/li&gt;&lt;li&gt;Laryngitis: REST the voice — do NOT whisper (strains cords).&lt;/li&gt;&lt;li&gt;Hoarseness &amp;gt; 2 weeks → get evaluated (cancer).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Persistent hoarseness &amp;gt;2 weeks needs evaluation for laryngeal cancer. Watch for airway swelling.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Untreated strep → rheumatic fever, glomerulonephritis, peritonsillar abscess.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-epistaxis&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 4&lt;/div&gt;&lt;h2&gt;Epistaxis (Nosebleed)&lt;/h2&gt;&lt;/div&gt;

      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Epistaxis (Nosebleed)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bleeding from the nasal mucosa (anterior most common).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Disruption of fragile nasal vessels → bleeding; posterior bleeds more serious.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Humidify air, avoid nose-picking/forceful blowing, control BP, manage anticoagulation.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Dry air, trauma, HTN, anticoagulants, cocaine use, clotting disorders.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Visible bleeding from nostril(s); posterior: blood in throat, possible airway risk.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;CBC, coagulation studies if recurrent/severe.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Clinical; rhinoscopy to locate posterior source.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Lean FORWARD; pinch SOFT part of nose 10–15 min without releasing.&lt;/li&gt;&lt;li&gt;Apply ice to nose/back of neck; keep calm.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Topical vasoconstrictors; cautery; nasal packing if uncontrolled.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Lean forward (NOT back → aspiration).&lt;/li&gt;&lt;li&gt;Don’t blow/pick nose after; humidify; avoid bending/straining.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Posterior bleed = airway/aspiration risk — priority is airway. Never tilt the head back.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Aspiration, hypovolemia (severe), airway obstruction (posterior packing).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-osa&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Obstructive Sleep Apnea (OSA)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Repeated upper-airway collapse during sleep → apnea/hypopnea &amp;amp; hypoxemia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Soft tissue relaxes &amp;amp; obstructs the airway → repeated O₂ drops, fragmented sleep.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Weight management, avoid alcohol/sedatives before bed, side-sleeping.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Obesity, large neck circumference, male, alcohol, sedatives, enlarged tonsils.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Loud snoring, witnessed apnea, gasping, daytime sleepiness, morning headache, irritability.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG if severe; screening questionnaires.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;POLYSOMNOGRAPHY (sleep study) = definitive.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Promote weight loss; positioning; ensure CPAP adherence.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Avoid sedatives/opioids that worsen apnea.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;CPAP = most effective treatment — use EVERY night.&lt;/li&gt;&lt;li&gt;Lose weight, avoid alcohol/sedatives, side-sleep.&lt;/li&gt;&lt;li&gt;Report daytime sleepiness, mask issues.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Avoid CNS depressants (worsen airway collapse). Caution with post-op opioids — high airway risk.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;HTN, dysrhythmias, pulmonary HTN, right heart failure, stroke risk.&lt;/li&gt;&lt;/ul&gt;       &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Cancer of the Larynx&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Malignant tumor of the larynx (voice box).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Tumor invades vocal cords/structures → voice change, airway compromise; can metastasize.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Avoid tobacco AND alcohol; report persistent hoarseness early.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;TOBACCO + ALCOHOL (combined), HPV, chronic reflux, occupational exposure.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Earliest: HOARSENESS &amp;gt; 2 weeks; later: dysphagia, lump, sore throat, ear pain, weight loss.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Biopsy for diagnosis; imaging for staging.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Laryngoscopy + biopsy; CT/MRI staging.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Post-laryngectomy: AIRWAY priority, stoma care, humidification.&lt;/li&gt;&lt;li&gt;Communication plan; emotional support; nutrition.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pain control; chemo/radiation as adjunct.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Total laryngectomy = PERMANENT stoma (breathe through neck).&lt;/li&gt;&lt;li&gt;Stoma care; never smoke; protect from water; humidify.&lt;/li&gt;&lt;li&gt;Speech rehab options (electrolarynx, esophageal speech).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; After laryngectomy the AIRWAY is the priority; keep emergency equipment ready. Humidify constantly.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Airway obstruction, aspiration, stoma stenosis, metastasis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-laryngeal-obstruction&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Laryngeal Obstruction&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Acute partial/complete blockage of the upper airway — EMERGENCY.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Edema, foreign body, or spasm blocks airflow → hypoxia within minutes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cut food small, chew well, avoid talking while eating, allergy management.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Aspirated food (“café coronary”), anaphylaxis/edema, infection (epiglottitis), trauma.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;STRIDOR, inability to speak, gasping, cyanosis, panic, accessory muscle use.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;None acutely — act first; ABG after stabilization.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Clinical/visual; laryngoscopy once stable.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Conscious choking adult → abdominal thrusts.&lt;/li&gt;&lt;li&gt;Anaphylaxis → epinephrine, prepare for intubation/cricothyrotomy.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Epinephrine (anaphylaxis); corticosteroids for edema.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Foreign-body prevention; EpiPen use if allergic.&lt;/li&gt;&lt;li&gt;Seek emergency care for any airway swelling.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; This is an AIRWAY EMERGENCY — act immediately; do not delay for tests.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Respiratory arrest, hypoxic brain injury, death if not relieved.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;       &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Atelectasis&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Collapse of alveoli → reduced gas exchange.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Shallow breathing/immobility/mucus → alveoli collapse → V/Q mismatch → hypoxemia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Incentive spirometry, deep breathing &amp;amp; coughing, early ambulation, turn q2h.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;POST-OP (#1), immobility, shallow breathing, pain, anesthesia, mucus plugging.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Diminished breath sounds, dyspnea, ↓ SpO₂, low-grade fever, tachycardia, tachypnea.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG: hypoxemia; pulse ox.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray (area of collapse).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;FIRST-LINE: incentive spirometry + deep breathing &amp;amp; coughing.&lt;/li&gt;&lt;li&gt;Ambulate early; reposition q2h; Semi-Fowler’s; pain control to allow breathing.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bronchodilators/mucolytics if indicated; analgesia for splinting.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Use incentive spirometer ~10×/hr while awake.&lt;/li&gt;&lt;li&gt;Splint incision when coughing; get up &amp;amp; move.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; #1 post-op complication — prevention is the priority. Escalate to IPPB/bronch only if first-line fails.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pneumonia, hypoxemia, respiratory failure if untreated.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-pneumonia&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 5&lt;/div&gt;&lt;h2&gt;Pneumonia&lt;/h2&gt;&lt;/div&gt;

      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Pneumonia&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Infection/inflammation of lung parenchyma → alveoli fill with exudate.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pathogen → inflammation → alveolar consolidation → impaired gas exchange.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pneumococcal + flu vaccines, hand hygiene, oral care, mobility, deep breathing.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Older adults, immobility, aspiration, COPD, smoking, immunosuppression, intubation (VAP).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Fever, chills, productive cough (rust/yellow), pleuritic pain, crackles, ↓SpO₂.&lt;/li&gt;&lt;li&gt;OLDER ADULTS: CONFUSION may be the first/only sign.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;CBC (↑WBC), SPUTUM CULTURE before antibiotics, ABG.&lt;/li&gt;&lt;li&gt;Blood cultures if severe.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray (infiltrates/consolidation).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;High-Fowler’s; O₂; ↑fluids 2–3 L; deep breathing/coughing; chest physiotherapy.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Antibiotics (after culture); antipyretics; bronchodilators.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Finish antibiotics; vaccines; ↑fluids; rest.&lt;/li&gt;&lt;li&gt;Return if worsening dyspnea/fever.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; SPUTUM CULTURE before first antibiotic. New confusion in an older adult = suspect infection.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Sepsis, pleural effusion/empyema, respiratory failure, ARDS.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-tb&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 5&lt;/div&gt;&lt;h2&gt;Tuberculosis (TB)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Tuberculosis (TB)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Airborne infection by Mycobacterium tuberculosis (usually lungs).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Inhaled droplet nuclei → lung infection → granuloma; can stay latent or activate.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Identify/treat latent TB, airborne precautions, screen high-risk, BCG (some regions).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Immunosuppression/HIV, crowded living, healthcare/homeless/incarcerated, foreign-born from high-prevalence areas.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Productive cough, NIGHT SWEATS, weight loss, low-grade fever, fatigue, hemoptysis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Mantoux (TST): read 48–72 hr, measure INDURATION (≥5/10/15 mm by risk).&lt;/li&gt;&lt;li&gt;IGRA (QuantiFERON); 3 sputum AFB cultures.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray (upper-lobe lesions); sputum culture = definitive.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;AIRBORNE: negative-pressure room, N95 for staff, mask on client for transport, door closed.&lt;/li&gt;&lt;li&gt;Promote adherence (DOT).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;RIPE: Rifampin, Isoniazid (give B6), Pyrazinamide, Ethambutol — 6–12 months.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Take ALL meds the full course (resistance if stopped).&lt;/li&gt;&lt;li&gt;Rifampin = orange fluids; Ethambutol = report vision change.&lt;/li&gt;&lt;li&gt;Cover cough; follow-up sputum tests.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Airborne isolation until 3 negative sputum cultures. Ethambutol vision change → stop &amp;amp; report.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Drug-resistant TB, miliary/disseminated TB, lung destruction.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-arf&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 5&lt;/div&gt;&lt;h2&gt;Acute Respiratory Failure (ARF)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Acute Respiratory Failure (ARF)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Inadequate gas exchange: PaO₂ &amp;lt;60 OR PaCO₂ &amp;gt;50 with pH &amp;lt;7.35.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Ventilation and/or oxygenation failure → hypoxemia ± hypercapnia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Treat underlying causes early (COPD, pneumonia, PE); monitor at-risk clients.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;COPD exacerbation, pneumonia, PE, neuromuscular disease, overdose, ARDS.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Severe dyspnea, restlessness → confusion, accessory muscle use, cyanosis, tachy then brady.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG (defines it): ↓PaO₂, ↑PaCO₂, ↓pH.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray; identify underlying cause.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Maintain AIRWAY; high-Fowler’s; O₂; prepare for intubation/mechanical ventilation.&lt;/li&gt;&lt;li&gt;Treat the cause.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bronchodilators, steroids, antibiotics per cause; sedation if ventilated.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;(Acute.) Explain procedures; involve in recovery/rehab planning.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Airway first; watch for the deceptively normal/rising PaCO₂ = tiring → failure.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cardiac arrest, organ failure, death without support.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-a     &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;ARDS&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Acute severe lung injury → refractory hypoxemia + bilateral infiltrates.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Alveolar-capillary membrane damage → fluid floods alveoli → surfactant loss → stiff lungs, severe V/Q mismatch.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Early treatment of sepsis/aspiration; lung-protective vent settings.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;SEPSIS (#1), aspiration, trauma, burns, near-drowning, pancreatitis, multiple transfusions.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Refractory HYPOXEMIA (no improvement on 100% O₂), severe dyspnea, tachypnea, crackles.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG: severe hypoxemia; ↓ PaO₂/FiO₂ ratio.&lt;/li&gt;&lt;li&gt;Normal BNP (helps distinguish from cardiac edema).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray: bilateral “ground-glass”/white-out infiltrates.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Mechanical ventilation + PEEP; PRONE positioning 12–16 hr/day.&lt;/li&gt;&lt;li&gt;Low tidal-volume (lung-protective) ventilation; conservative fluids; sedation.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Treat cause (antibiotics for sepsis); sedation/analgesia ± paralytics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;(ICU.) Family support; explain prone therapy &amp;amp; vent.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Hypoxemia that doesn’t respond to 100% O₂ = hallmark. Paralytics require sedation + analgesia.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=       &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Pulmonary Edema&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Fluid accumulation in alveoli → impaired gas exchange.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cardiogenic (left heart failure → backup) or non-cardiogenic (ARDS) → alveolar flooding.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Manage heart failure, fluid/sodium control, daily weights, med adherence.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Left-sided heart failure, fluid overload, MI, valve disease, ARDS.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;PINK FROTHY sputum, severe dyspnea, orthopnea, crackles, anxiety, “suffocation” feeling.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG (hypoxemia); BNP ↑ if cardiac.&lt;/li&gt;&lt;li&gt;Electrolytes with diuretics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray; echocardiogram for cardiac cause.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;High-Fowler’s with legs DEPENDENT (↓ preload); O₂/CPAP/BiPAP.&lt;/li&gt;&lt;li&gt;Daily weights, strict I&amp;amp;O, monitor K⁺.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Diuretics (furosemide), vasodilators (nitroglycerin), morphine.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Low-sodium diet, daily weights, report weight gain/SOB.&lt;/li&gt;&lt;li&gt;Med adherence (diuretics, cardiac drugs).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Pink frothy sputum = classic. Monitor potassium with loop diuretics.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Respiratory failure, cardiac arrest, hypoxic organ injury.&lt;/li&gt;&lt;/ul&gt;       &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Pneumothorax &amp;amp; Hemothorax&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Air (pneumo) or blood (hemo) in the pleural space → lung collapse.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Loss of negative pressure → lung collapses; TENSION type shifts mediastinum → shock.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Prevent trauma; careful with central lines/procedures; treat spontaneous early.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest trauma, central line/procedure, tall thin young males (spontaneous), COPD, mechanical ventilation.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Sudden pleuritic pain, dyspnea, ABSENT breath sounds on side; pneumo = hyperresonant, hemo = dull.&lt;/li&gt;&lt;li&gt;TENSION: tracheal deviation to UNAFFECTED side, JVD, hypotension.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&g
