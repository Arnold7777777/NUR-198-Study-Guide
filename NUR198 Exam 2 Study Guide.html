  &lt;/div&gt;
  &lt;div class=&quot;study7&quot;&gt;
    &lt;b&gt;How to use this sheet:&lt;/b&gt; this is the condensed high-yield layer — the lines that win the most
    points. For full detail use the Study Guide; to test yourself use the Master Test Bank.
    Read each section out loud once, then quiz yourself on the bolded triggers.
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;1&lt;/span&gt;&lt;span&gt;🅰️ Golden Priority Rules&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ The 3 rules that answer most questions&lt;/span&gt;

&lt;b&gt;1. ABCs first&lt;/b&gt; — Airway → Breathing → Circulation. Oxygen comes &lt;b&gt;before&lt;/b&gt; heparin,
before a CT scan, before calling the provider.&lt;br&gt;
&lt;b&gt;2. Assessment before action&lt;/b&gt; — with only subjective data (e.g., &quot;I'm short of breath&quot;),
get &lt;b&gt;vital signs + SpO₂&lt;/b&gt; first. If the client is already crashing (SpO₂ &amp;lt;90%, RR 38), act = give O₂.&lt;br&gt;
&lt;b&gt;3. Equipment first on a stable monitored client&lt;/b&gt; — labored breathing on a working O₂ device →
check tubing/flow meter/mask &lt;b&gt;before&lt;/b&gt; escalating. (A DNR does not change nursing assessment.)&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Acute &amp;amp; severe vs. vague&lt;/span&gt; — Crashing client (numbers given, clearly hypoxic) → &lt;b&gt;intervene&lt;/b&gt; (O₂). Vague complaint, no numbers → &lt;b&gt;assess&lt;/b&gt; (VS + SpO₂).&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Spontaneous vs. tension PTX&lt;/span&gt; — Spontaneous pneumothorax → &lt;b&gt;chest tube&lt;/b&gt;. Tension pneumothorax (tracheal deviation, JVD, shock) → &lt;b&gt;needle decompression FIRST&lt;/b&gt;, then chest tube.&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;&lt;span&gt;🩸 ABGs in 30 Seconds&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🩸 Normal values (memorize)&lt;/span&gt;

&lt;b&gt;pH&lt;/b&gt; 7.35–7.45 · &lt;b&gt;PaCO₂&lt;/b&gt; 35–45 (respiratory) · &lt;b&gt;HCO₃&lt;/b&gt; 22–26 (metabolic) ·
&lt;b&gt;PaO₂&lt;/b&gt; 80–100 · &lt;b&gt;SpO₂&lt;/b&gt; 95–100%.&lt;br&gt;
&amp;lt;60 PaO₂ = hypoxemia · &amp;lt;90% SpO₂ = emergency.&lt;/div&gt;
&lt;div class=&quot;box tip&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧭 ROME (find the cause)&lt;/span&gt;

&lt;b&gt;R&lt;/b&gt;espiratory = &lt;b&gt;O&lt;/b&gt;pposite (pH &amp;amp; CO₂ move opposite ways).&lt;br&gt;
&lt;b&gt;M&lt;/b&gt;etabolic = &lt;b&gt;E&lt;/b&gt;qual (pH &amp;amp; HCO₃ move the same way).&lt;br&gt;
Then ask: is the other value compensating?&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🌬️ ABG patterns that signal danger&lt;/span&gt;

&lt;b&gt;Asthma attack:&lt;/b&gt; early = respiratory &lt;b&gt;alkalosis&lt;/b&gt; (blowing off CO₂). A &lt;b&gt;&quot;normal&quot; or rising
PaCO₂ mid-attack = the client is tiring → respiratory acidosis → respiratory failure imminent.&lt;/b&gt;&lt;br&gt;
&lt;b&gt;COPD target SpO₂ = 88–92%&lt;/b&gt;, NOT 95–100% (hypoxic drive — too much O₂ suppresses breathing).&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;3&lt;/span&gt;&lt;span&gt;💨 Oxygen &amp;amp; Delivery Devices&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Venturi mask&lt;/span&gt; — &lt;b&gt;Most precise FiO₂&lt;/b&gt; → the COPD go-to. Dial sets an exact %.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Non-rebreather&lt;/span&gt; — &lt;b&gt;Highest FiO₂ without intubation&lt;/b&gt; (80–95%). Keep the bag inflated; check the one-way valve flap hourly.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Nasal cannula&lt;/span&gt; — Most comfortable; humidify if ≥4 L/min. Simple mask needs ≥5 L/min to flush CO₂.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Hypoxemia — early vs. late&lt;/span&gt; — Early = restlessness, tachypnea, tachycardia, ↑BP (compensating). Late = cyanosis, bradypnea, bradycardia, hypotension (failing).&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ SpO₂ &amp;lt;90% — do this&lt;/span&gt;
1. Sit upright (HOB 90°) · 2. O₂ now (highest device available) · 3. Notify provider · 4. ABGs · 5. Reassess.&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;&lt;span&gt;👃 Upper Respiratory&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Epistaxis&lt;/span&gt; — Lean &lt;b&gt;FORWARD&lt;/b&gt; (never back → aspiration), pinch the &lt;b&gt;soft&lt;/b&gt; part 10–15 min without releasing. Uncontrolled → silver nitrate / packing / vasoconstrictors.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Rhinitis&lt;/span&gt; — Decongestants max &lt;b&gt;3–4 days&lt;/b&gt; (rebound congestion). Allergic → intranasal glucocorticoids. Guaifenesin = expectorant → push fluids.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Sinusitis&lt;/span&gt; — Facial pain &lt;b&gt;worse leaning forward&lt;/b&gt;; promote drainage with fluids/steam/HOB up. Red flag: stiff neck + high fever + severe headache → meningitis → report.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Laryngeal cancer&lt;/span&gt; — Risk = tobacco &lt;b&gt;+&lt;/b&gt; alcohol. Earliest sign = &lt;b&gt;hoarseness &amp;gt;2 weeks&lt;/b&gt; → report. Total laryngectomy = permanent stoma + new voice method.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Laryngeal obstruction&lt;/span&gt; — Stridor, can't speak, cyanosis, “café coronary” = aspirated food. Conscious choking → abdominal thrusts.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;OSA&lt;/span&gt; — CPAP = most effective; check skin under the mask. Weight loss, side-sleeping, avoid alcohol/sedatives.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Tracheostomy&lt;/span&gt; — Spare tube + obturator at bedside always · cuff 20–30 cm H₂O · suction ≤10–15 s, hyperoxygenate, PRN only · humidify (upper airway bypassed).&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Procedures — don't mix them up&lt;/span&gt;

&lt;b&gt;Bronchoscopy:&lt;/b&gt; NPO before; &lt;b&gt;gag reflex must return before eating&lt;/b&gt; (ice chips first); benzocaine spray;
report bronchospasm/significant hemoptysis.&lt;br&gt;
&lt;b&gt;Thoracentesis:&lt;/b&gt; sit &lt;b&gt;upright, leaning forward over the bedside table&lt;/b&gt;; limit 1 L at a time
(re-expansion edema); watch for pneumothorax after. (Allen's test = ABG, not thoracentesis.)&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;5&lt;/span&gt;&lt;span&gt;🫁 Lower Respiratory &amp;amp; Chest&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Pneumonia&lt;/span&gt; — &lt;b&gt;Sputum culture BEFORE antibiotics&lt;/b&gt; — always. Position High-Fowler's. In older adults, the first sign is often &lt;b&gt;confusion&lt;/b&gt;, not fever/cough.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Atelectasis&lt;/span&gt; — Shallow breathing + immobility (post-op) = classic cause. First-line prevention = &lt;b&gt;incentive spirometry&lt;/b&gt;, early ambulation, deep breathing.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;ARF&lt;/span&gt; — PaO₂ &amp;lt;60 or PaCO₂ &amp;gt;50 with pH &amp;lt;7.35. Priority = airway → often needs PEEP/CPAP.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;ARDS&lt;/span&gt; — Severe hypoxemia &lt;b&gt;despite 100% O₂&lt;/b&gt; + bilateral ground-glass on CXR. Tx = mechanical vent + PEEP + &lt;b&gt;prone positioning&lt;/b&gt;. Normal BNP points to ARDS (not cardiac).&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Pulmonary edema&lt;/span&gt; — Pink frothy sputum, crackles, orthopnea. Tx = upright/legs dependent, O₂, diuretics; elevated BNP = cardiac origin.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Pneumo vs. hemothorax&lt;/span&gt; — Both: absent/↓ breath sounds. Pneumo = &lt;b&gt;hyperresonant&lt;/b&gt;; hemo = &lt;b&gt;dull&lt;/b&gt; + needs blood replacement.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Flail chest&lt;/span&gt; — ≥2 adjacent ribs, multiple fractures → &lt;b&gt;paradoxical&lt;/b&gt; movement. Tx = positive-pressure ventilation + pain control.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Pleural effusion / empyema&lt;/span&gt; — Effusion → thoracentesis (max 1 L). Empyema (pus) = complication of untreated pneumonia → chest tube + IV antibiotics.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Thoracotomy&lt;/span&gt; — Post-op: airway/breathing first, then pain control so they can deep-breathe &amp;amp; cough; incentive spirometry.&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧰 Chest drainage — the 4 you must recognize&lt;/span&gt;

&lt;b&gt;Tidaling&lt;/b&gt; in water seal = normal (lung re-expanding) · &lt;b&gt;Gentle constant bubbling&lt;/b&gt; in the
suction chamber = normal · &lt;b&gt;Continuous bubbling in the WATER SEAL&lt;/b&gt; = air leak → tighten connections,
notify · &lt;b&gt;&amp;gt;70–100 mL/hr or bright red&lt;/b&gt; = report. &lt;b&gt;NEVER&lt;/b&gt; clamp/strip/milk routinely; keep
the system &lt;b&gt;below chest level&lt;/b&gt;; keep 2 hemostats + sterile water + occlusive dressing at bedside.&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🤖 Mechanical ventilation quick hits&lt;/span&gt;

Confirm ET tube: capnography (immediate) + bilateral breath sounds + CXR (definitive, 2–3 cm above carina).&lt;br&gt;
&lt;b&gt;High-pressure alarm&lt;/b&gt; = obstruction (secretions, kink, bite, bronchospasm, pneumothorax).
&lt;b&gt;Low-pressure alarm&lt;/b&gt; = disconnection/leak. &lt;b&gt;Never&lt;/b&gt; turn alarms off.&lt;br&gt;
&lt;b&gt;VAP bundle:&lt;/b&gt; HOB 30–45° · chlorhexidine oral care · daily sedation vacation + wean check · ulcer &amp;amp; DVT prophylaxis.&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;6&lt;/span&gt;&lt;span&gt;🧪 Tuberculosis &amp;amp; RIPE&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧪 TB basics&lt;/span&gt;

&lt;b&gt;Airborne:&lt;/b&gt; negative-pressure room · N95 for staff · surgical mask on client for transport · door closed.&lt;br&gt;
&lt;b&gt;Mantoux:&lt;/b&gt; read at 48–72 h, measure &lt;b&gt;induration&lt;/b&gt; (not redness). ≥5 mm (high risk) / ≥10 (moderate) / ≥15 (low).&lt;br&gt;
Classic triad: cough, night sweats, weight loss. 3 negative sputum cultures = no longer infectious. Adherence is everything.&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;💊 RIPE — “RIP Eyes”&lt;/span&gt;

&lt;b&gt;R&lt;/b&gt;ifampin → red/orange secretions (harmless; affects OCP).&lt;br&gt;
&lt;b&gt;I&lt;/b&gt;soniazid → neuropathy → give &lt;b&gt;B6&lt;/b&gt;; hepatotoxic.&lt;br&gt;
&lt;b&gt;P&lt;/b&gt;yrazinamide → joint pain / gout.&lt;br&gt;
&lt;b&gt;E&lt;/b&gt;thambutol → &lt;b&gt;Eyes&lt;/b&gt; (vision/color) → &lt;b&gt;STOP immediately&lt;/b&gt; if vision changes.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;7&lt;/span&gt;&lt;span&gt;🌬️ Chronic Pulmonary &amp;amp; PE&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;COPD types&lt;/span&gt; — Emphysema = “pink puffer,” barrel chest, hyperresonance. Chronic bronchitis = “blue bloater,” cyanosis, productive cough (worst in morning).&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;COPD #1 risk&lt;/span&gt; — &lt;b&gt;Cigarette smoking&lt;/b&gt;. (AAT deficiency → panacinar emphysema in young non-smokers.) Can use portable O₂ and leave home.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;COPD diet/activity&lt;/span&gt; — High-calorie, high-protein, 4–6 small meals (big meals press the diaphragm). Pace activity; clear secretions in the morning.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Breathing&lt;/span&gt; — &lt;b&gt;Pursed-lip&lt;/b&gt; = nose in, slow blow out through pursed lips (prevents air trapping). &lt;b&gt;Diaphragmatic&lt;/b&gt; = hand on belly rises. “Hand on stomach” = diaphragmatic.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Asthma&lt;/span&gt; — Reversible obstruction. &lt;b&gt;No wheezing in a severe attack = danger&lt;/b&gt; (too obstructed). SABA (albuterol) for acute; LABA (salmeterol) for prevention only — &lt;b&gt;never&lt;/b&gt; LABA for an attack.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Inhaler order&lt;/span&gt; — &lt;b&gt;Bronchodilator first&lt;/b&gt; (opens airways) → then steroid inhaler. Rinse mouth after ICS (thrush). Status asthmaticus → O₂, IV fluids/bronchodilators, epinephrine, steroids, prepare to intubate.&lt;/div&gt;
&lt;div class=&quot;kp&quot;&gt;&lt;span class=&quot;lead&quot;&gt;Lung cancer&lt;/span&gt; — NSCLC = most common; SCLC = fast, smoking-linked. Often found late; most common presenting sign = cough with hemoptysis. Annual low-dose CT for high-risk.&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🩸 Pulmonary Embolism — the big one&lt;/span&gt;

Most common cause = &lt;b&gt;DVT&lt;/b&gt; (leg vein); Virchow's triad = stasis + hypercoagulability + vessel injury.&lt;br&gt;
Classic: sudden pleuritic chest pain + dyspnea + anxiety / “impending doom.”&lt;br&gt;
&lt;b&gt;Priority = OXYGEN FIRST&lt;/b&gt; (not heparin, not CT). Then High-Fowler's, assess, notify, IV heparin (aPTT), MDCTA.&lt;br&gt;
&lt;b&gt;Heparin contraindication:&lt;/b&gt; active &lt;b&gt;peptic ulcer&lt;/b&gt; = GI bleed risk. (A previous DVT is the &lt;i&gt;reason&lt;/i&gt; for heparin, not a contraindication.) Best prevention = &lt;b&gt;early ambulation&lt;/b&gt;.&lt;/div&gt;

&lt;div class=&quot;section-head&quot;&gt;&lt;span class=&quot;n&quot;&gt;8&lt;/span&gt;&lt;span&gt;🧠 One-Line Memory Bank&lt;/span&gt;&lt;/div&gt;&lt;hr class=&quot;hr&quot;&gt;
&lt;div class=&quot;box tip&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🎯 Say these out loud before you walk in&lt;/span&gt;

• ABCs first — O₂ before heparin, before CT, before calling.&lt;br&gt;
• Assess before acting; intervene if already crashing.&lt;br&gt;
• Venturi = most precise; non-rebreather = highest without intubation.&lt;br&gt;
• COPD SpO₂ target 88–92%.&lt;br&gt;
• Sputum culture &lt;b&gt;before&lt;/b&gt; antibiotics — pneumonia &amp;amp; TB.&lt;br&gt;
• Epistaxis → lean forward, pinch soft part.&lt;br&gt;
• Spontaneous PTX → chest tube; tension PTX → needle decompression first.&lt;br&gt;
• Chest tube below chest; tidaling normal; continuous water-seal bubbling = air leak.&lt;br&gt;
• Vecuronium paralyzes only — always add a sedative + analgesic.&lt;br&gt;
• Ethambutol → eyes → stop if vision changes; Rifampin → orange (harmless).&lt;br&gt;
• No wheeze in a severe asthmatic = danger; LABA never for acute.&lt;br&gt;
• PE → oxygen first; peptic ulcer contraindicates heparin.&lt;br&gt;
• Older-adult pneumonia often shows up as confusion first.&lt;/div&gt;

&lt;title&gt;NUR 198 Exam 2 Study Guide — Modules 4–6&lt;/title&gt;
&lt;style&gt;/* ============================================================
   NUR 198 Canonical Study Style — Caroline's Edition
   Background gradient: deep purple -&gt; (1/8) deep lavender -&gt; (1/4) dark pink
   High contrast, large fonts (15px+), ADHD-friendly spacing.
   ============================================================ */
:root{
  --bg0:#1a0d2e;        /* deep purple (top) */
  --bg1:#241640;        /* deep purple-ish */
  --lav:#3a2a5e;        /* deep lavender (~1/8 down) */
  --pink:#5e1f47;       /* dark pink (~1/4 down) */
  --card:#241a3d;
  --card2:#2b2050;
  --ink:#f4f0ff;        /* near-white text */
  --ink-soft:#cdc3e8;
  --muted:#a99fc7;
  --gold:#ffcf5c;
  --gold-soft:#ffe49b;
  --green:#5be39b;
  --green-soft:#9af5c6;
  --red:#ff7a8a;
  --blue:#7fb4ff;
  --teal:#4fd6c9;
  --violet:#b58cff;
  --magenta:#ff7ad6;
  --orange:#ffa45c;
  --line:#473a6b;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:&quot;Segoe UI&quot;,system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:16px;
  line-height:1.6;
  color:var(--ink);
  background:
    linear-gradient(180deg,
      var(--bg0) 0%,
      var(--bg1) 8%,
      var(--lav) 22%,
      var(--pink) 46%,
      var(--bg1) 75%,
      var(--bg0) 100%);
  background-attachment:fixed;
  padding:0;
}
.wrap{max-width:1000px;margin:0 auto;padding:28px 22px 80px;}

/* ---------- Title block ---------- */
.title-card{
  background:linear-gradient(135deg, rgba(58,42,94,.92), rgba(94,31,71,.85));
  border:1px solid var(--line);
  border-radius:20px;
  padding:34px 30px;
  margin-bottom:26px;
  box-shadow:0 10px 34px rgba(0,0,0,.4);
  text-align:center;
}
.title-card .emoji{font-size:46px;line-height:1;}
.title-card h1{
  font-size:38px;line-height:1.15;margin:10px 0 6px;font-weight:800;
  color:#fff;letter-spacing:.5px;
}
.title-card .sub{font-size:18px;color:var(--gold-soft);font-weight:600;margin-bottom:16px;}
.chipbar{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px;}
.chip{
  background:rgba(181,140,255,.14);
  border:1px solid var(--violet);
  color:var(--ink);
  padding:6px 14px;border-radius:30px;font-size:14px;font-weight:600;white-space:nowrap;
}
.note-bar{
  background:rgba(255,255,255,.06);
  border-radius:12px;padding:14px 18px;margin-top:18px;text-align:left;
  font-size:15px;color:var(--ink-soft);
}

/* ---------- TOC / nav ---------- */
.toc{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 22px;margin-bottom:26px;
}
.toc h2{font-size:18px;margin:0 0 12px;color:var(--gold);}
.toc a{
  display:inline-block;color:var(--blue);text-decoration:none;font-size:15px;
  padding:5px 12px;margin:4px 6px 4px 0;border:1px solid var(--line);border-radius:20px;
  background:rgba(127,180,255,.08);
}
.toc a:hover{background:rgba(127,180,255,.2);}

/* ---------- Module banner ---------- */
.module-banner{
  border-radius:16px;padding:18px 22px;margin:34px 0 18px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
.module-banner .ico{font-size:34px;}
.module-banner h2{margin:0;font-size:26px;font-weight:800;color:#fff;}
.module-banner .tag{font-size:14px;color:rgba(255,255,255,.85);font-weight:600;display:block;margin-top:2px;}
.mb-purple{background:linear-gradient(100deg,#5a2d82,#7a3ea0);}
.mb-teal{background:linear-gradient(100deg,#155e63,#1c7293);}
.mb-pink{background:linear-gradient(100deg,#8e2d6b,#b8478a);}
.mb-blue{background:linear-gradient(100deg,#21408a,#2f6ad0);}
.mb-green{background:linear-gradient(100deg,#1f6b3a,#2f9a52);}
.mb-orange{background:linear-gradient(100deg,#9a4a1a,#c47a2f);}

/* ---------- Section sub-head ---------- */
.subhead{
  display:flex;align-items:center;gap:10px;margin:26px 0 12px;
  font-size:21px;font-weight:800;color:var(--gold);
  border-bottom:2px solid var(--line);padding-bottom:8px;
}
.hi-pill{
  font-size:12px;background:var(--gold);color:#2a1c00;font-weight:800;
  padding:3px 9px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase;
}

/* ---------- Cards / boxes ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin:14px 0;
}
.card h3{margin:0 0 10px;font-size:18px;color:var(--violet);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:720px){.grid2{grid-template-columns:1fr;}}

ul.clean{margin:6px 0;padding-left:22px;}
ul.clean li{margin:5px 0;}

/* info boxes */
.box{border-radius:12px;padding:14px 16px;margin:14px 0;font-size:15px;border-left:6px solid;color:var(--ink);}
.box b{color:#fff;}
.box .bt{font-weight:800;display:block;margin-bottom:5px;font-size:15px;}
.box.trap{background:#2e2238;border-color:var(--orange);}
.box.trap .bt{color:var(--orange);}
.box.mem{background:#1f2440;border-color:var(--blue);}
.box.mem .bt{color:var(--blue);}
.box.snap{background:#33203a;border-color:var(--red);}
.box.snap .bt{color:var(--red);}
.box.crit{background:#331f3d;border-color:var(--magenta);}
.box.crit .bt{color:var(--magenta);}
.box.tip{background:#1c2e30;border-color:var(--green);}
.box.tip .bt{color:var(--green);}

/* Module objectives / deliverables box */
.objbox{
  background:linear-gradient(135deg, rgba(58,42,94,.55), rgba(94,31,71,.40));
  border:1px solid var(--line);border-left:6px solid var(--gold);
  border-radius:14px;padding:18px 22px;margin:0 0 22px;
  box-shadow:0 6px 18px rgba(0,0,0,.30);
}
.objbox .ob-h{
  display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;
  color:var(--gold);margin:0 0 4px;
}
.objbox .ob-note{font-size:14px;color:var(--ink);opacity:.92;margin:0 0 14px;}
.objbox .ob-sub{
  font-size:14px;font-weight:800;color:var(--gold-soft);
  text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px;
}
.objbox ol.obj{margin:6px 0 4px;padding-left:24px;}
.objbox ol.obj li{margin:7px 0;font-size:15.5px;color:var(--ink);line-height:1.5;}
.objbox ol.obj li .co{color:var(--violet);font-weight:700;font-size:13px;}
.objbox .ob-topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.objbox .ob-topics .tp{
  font-size:13.5px;background:rgba(127,180,255,.12);color:var(--ink);
  border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-weight:600;
}
.objbox .ob-topics .tp.new{background:rgba(91,227,155,.16);border-color:var(--green);color:var(--green-soft);}
.objbox .ob-cross{font-size:13.5px;color:var(--ink);opacity:.88;margin-top:12px;font-style:italic;}

/* DO / NEVER grid */
.dn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
@media(max-width:720px){.dn{grid-template-columns:1fr;}}
.dn .do,.dn .never{border-radius:12px;padding:14px 16px;font-size:15px;}
.dn .do{background:#1c2e30;border:1px solid var(--green);color:var(--ink);}
.dn .never{background:#33203a;border:1px solid var(--red);color:var(--ink);}
.dn .do .h{color:var(--green-soft);font-weight:800;display:block;margin-bottom:6px;}
.dn .never .h{color:var(--red);font-weight:800;display:block;margin-bottom:6px;}

/* tables */
table.t{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px;background:#241a3d;border-radius:10px;overflow:hidden;}
table.t th{background:var(--card2);color:var(--gold-soft);text-align:left;padding:10px 12px;border:1px solid var(--line);font-size:13px;text-transform:uppercase;letter-spacing:.4px;}
table.t td{padding:9px 12px;border:1px solid var(--line);vertical-align:top;color:#ece7fb;}
table.t tr:nth-child(even) td{background:rgba(255,255,255,.025);}
.hl{color:var(--gold);font-weight:700;}
.hl-r{color:var(--red);font-weight:700;}
.hl-g{color:var(--green-soft);font-weight:700;}
.hl-b{color:var(--blue);font-weight:700;}

/* stat callouts */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;}
.stat .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.stat .big{font-size:30px;font-weight:800;color:var(--gold);margin:4px 0;}

&lt;a id=&quot;abg&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;subhead&quot;&gt;🧪 ABG Quick Reference &lt;span class=&quot;hi-pill&quot;&gt;Memorize&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;stats&quot;&gt;
  &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;pH&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;7.35–7.45&lt;/div&gt;&lt;div class=&quot;sm&quot;&gt;&amp;lt;7.35 Acidosis · &amp;gt;7.45 Alkalosis&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;PaO₂ (O₂ level)&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;80–100&lt;/div&gt;&lt;div class=&quot;sm&quot;&gt;&amp;lt;60 Hypoxemia · COPD target 88–92%&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;PaCO₂ (Resp)&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;35–45&lt;/div&gt;&lt;div class=&quot;sm&quot;&gt;&amp;gt;45 Hypovent · &amp;lt;35 Hypervent&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;HCO₃ (Metabolic)&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;22–26&lt;/div&gt;&lt;div class=&quot;sm&quot;&gt;&amp;lt;22 Metab acidosis · &amp;gt;26 alkalosis&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;SaO₂ / SpO₂&lt;/div&gt;&lt;div class=&quot;big&quot;&gt;95–100%&lt;/div&gt;&lt;div class=&quot;sm&quot;&gt;&amp;lt;90% Emergency · COPD 88–92% OK&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧭 ROME Method&lt;/span&gt;
&lt;b&gt;R&lt;/b&gt;espiratory = &lt;b&gt;O&lt;/b&gt;pposite (pH↓ CO₂↑ &amp;nbsp;or&amp;nbsp; pH↑ CO₂↓) &amp;nbsp;•&amp;nbsp;
&lt;b&gt;M&lt;/b&gt;etabolic = &lt;b&gt;E&lt;/b&gt;qual (pH↓ HCO₃↓ &amp;nbsp;or&amp;nbsp; pH↑ HCO₃↑).
Step 1: pH acid or alkaline? Step 2: which value (CO₂ vs HCO₃) matches the pH direction? That system is the cause.
Step 3: is the other value trying to compensate?&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — COPD O₂ Target&lt;/span&gt;
COPD clients target &lt;span class=&quot;hl&quot;&gt;88–92% SpO₂&lt;/span&gt;, NOT the normal 95–100%. &lt;b&gt;Hypoxic drive:&lt;/b&gt; they breathe because
of low O₂, not high CO₂, so over-oxygenating can suppress their drive to breathe. &lt;b&gt;Venturi mask = most precise O₂ → best for COPD.&lt;/b&gt;&lt;/div&gt;
&lt;a id=&quot;vq&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;subhead&quot;&gt;🔁 Ventilation &amp;amp; Perfusion (V/Q) — the foundation&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;💨 Ventilation (V)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Air &lt;b&gt;moving in &amp;amp; out&lt;/b&gt; of the alveoli.&lt;/li&gt;
    &lt;li&gt;Blocked by airway problems: mucus plug, bronchospasm, atelectasis, pneumothorax.&lt;/li&gt;
    &lt;li&gt;A &lt;b&gt;ventilation problem&lt;/b&gt; = air can't reach good blood flow.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🩸 Perfusion (Q)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Blood &lt;b&gt;flowing past&lt;/b&gt; the alveoli to pick up O₂.&lt;/li&gt;
    &lt;li&gt;Blocked by circulation problems: &lt;b&gt;pulmonary embolism&lt;/b&gt;, low cardiac output.&lt;/li&gt;
    &lt;li&gt;A &lt;b&gt;perfusion problem&lt;/b&gt; = good air but no blood to carry the O₂ away.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box tip&quot;&gt;&lt;span class=&quot;bt&quot;&gt;💡 V/Q Mismatch in one line&lt;/span&gt;
&lt;b&gt;Shunt&lt;/b&gt; = perfusion without ventilation (blood passes un-oxygenated air → pneumonia, atelectasis, ARDS).
&lt;b&gt;Dead space&lt;/b&gt; = ventilation without perfusion (air reaches alveoli with no blood flow → &lt;b&gt;pulmonary embolism&lt;/b&gt;).
Shunting is the main cause of hypoxia after chest/abdominal surgery.&lt;/div&gt;

&lt;div class=&quot;objbox&quot;&gt;
&lt;div class=&quot;ob-h&quot;&gt;🎯 Module 4 — What You Must Be Able to Do&lt;/div&gt;

&lt;p class=&quot;ob-cross&quot;&gt;For every disorder, be ready to cover: causes/risk factors, pathophysiology, diagnostic procedures, clinical manifestations, medical management, nursing management &amp;amp; priorities of care, and client teaching.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;subhead&quot;&gt;🩸 O₂ Delivery Systems &lt;span class=&quot;hi-pill&quot;&gt;Memorize&lt;/span&gt;&lt;/div&gt;
&lt;table class=&quot;t&quot;&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Device&lt;/th&gt;&lt;th&gt;FiO₂&lt;/th&gt;&lt;th&gt;Flow&lt;/th&gt;&lt;th&gt;Key points &amp;amp; nursing notes&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Nasal Cannula&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;24–44%&lt;/td&gt;&lt;td&gt;1–6 L/min&lt;/td&gt;&lt;td&gt;Humidify if ≥4 L/min; water-soluble gel for dry nares; most comfortable; client can eat/speak.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Simple Face Mask&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;35–60%&lt;/td&gt;&lt;td&gt;5–10 L/min&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl&quot;&gt;Min 5 L/min to flush CO₂;&lt;/span&gt; use NC during meals; imprecise FiO₂.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Partial Rebreather&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;60–90%&lt;/td&gt;&lt;td&gt;10–15 L/min&lt;/td&gt;&lt;td&gt;Keep reservoir bag from fully deflating; CO₂ re-inhaled from first part of exhalation.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Non-Rebreather ★&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;80–95%&lt;/td&gt;&lt;td&gt;10–15 L/min&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl&quot;&gt;Highest O₂ without intubation;&lt;/span&gt; check one-way valve flap hourly; keep bag inflated.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Venturi Mask ★&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;24–60%&lt;/td&gt;&lt;td&gt;10–15 L/min&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl&quot;&gt;MOST PRECISE FiO₂;&lt;/span&gt; best for COPD; dial/adapter sets exact %.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Face Tent / Trach Collar&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;24–100%&lt;/td&gt;&lt;td&gt;≥10 L/min&lt;/td&gt;&lt;td&gt;Facial trauma/burns; high humidification; empty condensation from tubing.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;T-Piece&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;24–100%&lt;/td&gt;&lt;td&gt;≥10 L/min&lt;/td&gt;&lt;td&gt;Tracheostomy, laryngectomy, or ET-tube clients only.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🎯 O₂ Device Mnemonics&lt;/span&gt;
&quot;NC = Nice &amp;amp; Comfortable&quot; (lowest, most tolerable) · &quot;NRB = No Room to Breathe&quot; (highest) ·
&quot;Venturi = Very precise&quot; (COPD go-to) · &quot;Simple = Simply imprecise.&quot;&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🆘 Hypoxemia — Early vs. Late &lt;span class=&quot;hi-pill&quot;&gt;Critical&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;dn&quot;&gt;
  &lt;div class=&quot;do&quot;&gt;&lt;span class=&quot;h&quot;&gt;⚡ EARLY — Compensatory (fighting back)&lt;/span&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Tachypnea&lt;/b&gt; (RR↑ to grab more O₂)&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Tachycardia&lt;/b&gt; (heart pumps faster)&lt;/li&gt;
    &lt;li&gt;Restlessness / anxiety / confusion&lt;/li&gt;
    &lt;li&gt;Pale skin &amp;amp; mucous membranes&lt;/li&gt;
    &lt;li&gt;↑ Blood pressure; nasal flaring; accessory-muscle use; tracheal tugging&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;never&quot;&gt;&lt;span class=&quot;h&quot;&gt;💀 LATE — Decompensation (failing)&lt;/span&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Cyanosis&lt;/b&gt; (O₂ critically low)&lt;/li&gt;
    &lt;li&gt;Confusion → stupor → coma&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Bradypnea&lt;/b&gt; (RR↓ = respiratory failure)&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Bradycardia &amp;amp; hypotension&lt;/b&gt; (cardiovascular collapse)&lt;/li&gt;
    &lt;li&gt;Cardiac dysrhythmias; end-organ failure&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ SNAP Decision — Hypoxemia Priority&lt;/span&gt;
SpO₂ &amp;lt;90%? → &lt;b&gt;1.&lt;/b&gt; Sit upright (HOB 90°) &amp;nbsp;&lt;b&gt;2.&lt;/b&gt; O₂ NOW (highest device available) &amp;nbsp;&lt;b&gt;3.&lt;/b&gt; Notify provider &amp;nbsp;&lt;b&gt;4.&lt;/b&gt; ABGs &amp;nbsp;&lt;b&gt;5.&lt;/b&gt; Reassess continuously.&lt;/div&gt;&lt;div class=&quot;subhead&quot;&gt;👅 Upper Respiratory Disorders&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🤧 Rhinitis (cold / allergic)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Cause:&lt;/b&gt; viral (common cold) or allergic; affects nasal mucosa.&lt;/li&gt;
    &lt;li&gt;Rhinorrhea, congestion, sneezing, itchy eyes, sore throat, low-grade fever.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Best for allergic:&lt;/b&gt; &lt;span class=&quot;hl-g&quot;&gt;intranasal glucocorticoids&lt;/span&gt; (fluticasone).&lt;/li&gt;
    &lt;li&gt;Decongestants: &lt;span class=&quot;hl-r&quot;&gt;max 3–4 days&lt;/span&gt; (rebound congestion!).&lt;/li&gt;
    &lt;li&gt;Guaifenesin (expectorant) — fluids ≥2,000 mL/day.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Nursing:&lt;/b&gt; rest 8–10 hr, humidifier, strict hand hygiene.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🦷 Sinusitis (rhinosinusitis)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Maxillary/frontal sinuses; often follows rhinitis.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Headache &amp;amp; facial pain WORSE leaning forward&lt;/span&gt;, purulent drainage, fever.&lt;/li&gt;
    &lt;li&gt;Tenderness on palpation over orbital/forehead areas.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;COMPLICATION:&lt;/span&gt; meningitis/encephalitis → severe headache + stiff neck + high fever = REPORT NOW.&lt;/li&gt;
    &lt;li&gt;Meds: decongestants, amoxicillin (bacterial only), NSAIDs/acetaminophen.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Nursing:&lt;/b&gt; steam, sinus irrigation, hot packs, fluids; avoid air travel/swimming.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🗣️ Pharyngitis &lt;span style=&quot;font-size:12px;color:#9af5c6&quot;&gt;(NEW)&lt;/span&gt;&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Inflammation of the throat; most often &lt;b&gt;viral&lt;/b&gt;; bacterial usually group A strep.&lt;/li&gt;
    &lt;li&gt;Sore throat, pain on swallowing, red pharynx, fever, enlarged lymph nodes.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Chronic risk:&lt;/b&gt; dusty environment, voice overuse, chronic cough, &lt;span class=&quot;hl&quot;&gt;alcohol + tobacco&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Teaching:&lt;/b&gt; finish the FULL antibiotic course even when feeling better (prevents resistance / rheumatic fever).&lt;/li&gt;
    &lt;li&gt;Warm saline gargles, fluids, throat lozenges, soft diet.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🔇 Laryngitis &lt;span style=&quot;font-size:12px;color:#9af5c6&quot;&gt;(NEW)&lt;/span&gt;&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Inflammation of the larynx → &lt;b&gt;hoarseness or voice loss&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Causes: voice overuse, viral URI, GERD reflux, irritant/smoke exposure.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Teaching:&lt;/b&gt; &lt;span class=&quot;hl&quot;&gt;rest the voice&lt;/span&gt; (don't whisper — it strains more), humidify air, increase fluids, avoid smoke/irritants.&lt;/li&gt;
    &lt;li&gt;Hoarseness lasting &lt;b&gt;&amp;gt;2 weeks&lt;/b&gt; → evaluate for laryngeal cancer.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🩸 Epistaxis (nosebleed)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Lean FORWARD&lt;/span&gt; (NOT back — prevents aspiration of blood).&lt;/li&gt;
    &lt;li&gt;Pinch the &lt;b&gt;SOFT&lt;/b&gt; part of the nose 10–15 min, continuous pressure.&lt;/li&gt;
    &lt;li&gt;Cold compress / ice pack to nose &amp;amp; back of neck.&lt;/li&gt;
    &lt;li&gt;Uncontrolled → nasal packing, silver nitrate cautery, or vasoconstrictors.&lt;/li&gt;
    &lt;li&gt;Position: sitting upright, leaning forward.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;😴 Obstructive Sleep Apnea (OSA)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Repeated upper-airway collapse in sleep → apnea → hypoxemia.&lt;/li&gt;
    &lt;li&gt;Risk: obesity, large neck circumference, male, alcohol use.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;CPAP = most effective treatment.&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Assess skin under the mask; ensure proper fit.&lt;/li&gt;
    &lt;li&gt;Weight loss, side sleeping, avoid alcohol/sedatives.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🎖️ Cancer of the Larynx&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Risk:&lt;/b&gt; heavy tobacco + alcohol use (BOTH = highest risk).&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Earliest sign: progressive hoarseness &amp;gt;2 weeks&lt;/span&gt; → report.&lt;/li&gt;
    &lt;li&gt;Tx: radiation, partial/total laryngectomy.&lt;/li&gt;
    &lt;li&gt;Post-total laryngectomy = &lt;b&gt;permanent stoma&lt;/b&gt; + new voice (electrolarynx, esophageal speech, TEP).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Top post-op priority = airway&lt;/b&gt; (ABC). Humidify home air; NEVER smoke near stoma.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🚫 Laryngeal Obstruction &lt;span style=&quot;font-size:12px;color:#9af5c6&quot;&gt;(NEW)&lt;/span&gt;&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Emergency&lt;/b&gt; — swelling of the larynx (anaphylaxis, edema, aspirated object) blocks airflow.&lt;/li&gt;
    &lt;li&gt;Signs: &lt;span class=&quot;hl-r&quot;&gt;stridor, inability to speak, gasping, cyanosis, panic&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;Aspirated food/object = leading cause; &lt;b&gt;&quot;café coronary.&quot;&lt;/b&gt;&lt;/li&gt;
    &lt;li&gt;Tx: abdominal thrusts (conscious choking), emergency intubation or tracheostomy, epinephrine for allergic edema.&lt;/li&gt;
    &lt;li&gt;Prevent: cut food small, no talking/laughing with full mouth, caution with alcohol at meals.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🔵 Tracheostomy Management &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;ul class=&quot;clean&quot;&gt;
  &lt;li&gt;&lt;b&gt;Spare tube + obturator at bedside AT ALL TIMES&lt;/b&gt; (plus same-size and one-size-smaller tube).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Cuff pressure 20–30 cm H₂O&lt;/b&gt; — below = air leak; above = tracheal necrosis.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Suction:&lt;/b&gt; hyperoxygenate before/after; ≤10–15 sec; sterile; PRN only (not routine); suction on withdrawal.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Ties:&lt;/b&gt; 1 finger fits between tie and neck; change with 2 nurses.&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Humidification required&lt;/b&gt; — prevents secretion crusting in the bypassed upper airway.&lt;/li&gt;
  &lt;li&gt;Monitor for skin breakdown at the stoma; keep emergency equipment ready in case of accidental decannulation.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🧪 Invasive Procedures — Nursing Role&lt;/div&gt;
&lt;table class=&quot;t&quot;&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Procedure&lt;/th&gt;&lt;th&gt;Pre&lt;/th&gt;&lt;th&gt;During&lt;/th&gt;&lt;th&gt;Post priorities&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Bronchoscopy&lt;/b&gt;&lt;/td&gt;
&lt;td&gt;NPO 4–8 hr; consent; remove dentures; check allergies; atropine/anxiolytic. PFT clients: no inhaler 4–6 hr, no smoking 6–8 hr before.&lt;/td&gt;
&lt;td&gt;Sitting or supine; monitor VS &amp;amp; SpO₂; assist with specimens.&lt;/td&gt;
&lt;td&gt;&lt;span class=&quot;hl&quot;&gt;GAG REFLEX must return before oral intake&lt;/span&gt;; ice chips first; watch for laryngospasm, significant hemoptysis, fever → provider.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Thoracentesis&lt;/b&gt;&lt;/td&gt;
&lt;td&gt;Consent; pre-procedure CXR; &lt;span class=&quot;hl&quot;&gt;sit upright, lean forward over bedside table&lt;/span&gt;; do NOT move or cough during.&lt;/td&gt;
&lt;td&gt;Sterile field; monitor VS; label specimens; &lt;span class=&quot;hl&quot;&gt;limit 1 L at a time&lt;/span&gt;.&lt;/td&gt;
&lt;td&gt;Occlusive dressing; auscultate lungs; post-CXR; watch for pneumothorax (tracheal deviation, dyspnea, absent breath sounds).&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — Bronchoscopy vs. Thoracentesis&lt;/span&gt;
&lt;b&gt;Bronchoscopy:&lt;/b&gt; NPO, gag reflex checked AFTER → ice chips first; benzocaine spray used here, NOT thoracentesis.
&lt;b&gt;Thoracentesis:&lt;/b&gt; Allen's test = ABG puncture (not this); position = leaning forward over bedside table; limit 1 L
at a time (re-expansion pulmonary edema risk).&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — Epistaxis Position&lt;/span&gt;
Nose bleeding → always lean &lt;b&gt;FORWARD&lt;/b&gt;. Leaning back sends blood down the throat → aspiration risk. Pinch the SOFT part
(not the bony bridge) a full 10–15 minutes without releasing to check.&lt;/div&gt;&lt;a id=&quot;m5&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;module-banner mb-pink&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🎘&lt;/span&gt;
