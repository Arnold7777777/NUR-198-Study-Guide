      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · System Disorder · Mod 5&lt;/div&gt;&lt;h2&gt;Pleural Effusion &amp;amp; Empyema&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Pleural Effusion &amp;amp; Empyema&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Fluid (effusion) or pus (empyema) collecting in the pleural space.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Fluid compresses lung → ↓ expansion; empyema = infected fluid (often from pneumonia).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Treat pneumonia &amp;amp; heart failure promptly.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pneumonia (empyema), heart failure, malignancy, TB, pulmonary embolism.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Dyspnea, DULL percussion, ↓ breath sounds, pleuritic pain; empyema adds fever.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pleural fluid analysis; CBC (↑WBC empyema).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray/CT; thoracentesis (diagnostic + therapeutic).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Position upright for thoracentesis; monitor post-procedure for pneumothorax.&lt;/li&gt;&lt;li&gt;Empyema: chest tube drainage + IV antibiotics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Antibiotics (empyema); treat underlying cause.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Deep breathing post-drainage; report fever/SOB.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Thoracentesis: ≤1 L removed at a time (re-expansion edema); watch for pneumothorax after.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Recurrent effusion, trapped lung, sepsis (empyema).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-asthma&quot;&gt;&lt;div cla       &lt;div class=&quot;f&quot;&gt;DISORDER: &lt;span&gt;Asthma&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chronic reversible airway inflammation with hyperresponsiveness.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Trigger → bronchospasm + edema + mucus → reversible airflow obstruction.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Identify/avoid triggers, controller meds, asthma action plan, flu vaccine.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Allergies, family history, exercise, cold air, smoke, infection, stress.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Wheezing, chest tightness, prolonged expiration, cough, dyspnea.&lt;/li&gt;&lt;li&gt;SILENT chest (no wheeze) in severe attack = EMERGENCY.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG: early = resp A       &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Malignant lung tumor — small-cell (SCLC) or non-small-cell (NSCLC).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Uncontrolled cell growth → airway/tissue invasion → metastasis; SCLC fast &amp;amp; smoking-linked.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;SMOKING CESSATION (#1), avoid radon/asbestos, low-dose CT screening for high-risk.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Smoking (#1), secondhand smoke, radon, asbestos, air pollution, family history.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Persistent cough ± HEMOPTYSIS, dyspnea, chest pain, hoarseness, weight loss, clubbing.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Sputum cytology; tumor markers; CBC/chemistry for staging.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chest x-ray/CT, bronchoscopy + BIOPSY (definitive), PET for staging.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Oxygenation, pain &amp;amp; symptom management, nutrition, emotional support.&lt;/li&gt;&lt;li&gt;Pre/post-op care for resection (lobectomy/pneumonectomy).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Chemo (cisplatin), targeted/immunotherapy, analgesics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Smoking cessation resources; screening for high-risk.&lt;/li&gt;&lt;li&gt;Symptom reporting; treatment side effects.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; Often diagnosed LATE. Smoking cessation is the top prevention. Report hemoptysis.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Metastasis, superior vena cava syndrome, pleural effusion, paraneoplastic syndromes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-pe&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Alterations in Health (Diagnosis)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Clot (usually from DVT) lodges in pulmonary circulation → blocked perfusion.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Pathophysiology&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Embolus blocks pulmonary blood flow → V/Q mismatch (good air, no blood) → hypoxemia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Health Promotion &amp;amp; Prevention&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Early ambulation, SCDs, prophylactic LMWH, leg exercises, hydration.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Assessment&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Risk Factors&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Immobility, surgery, DVT, long travel, estrogen/OCP, pregnancy, obesity, cancer, smoking (Virchow’s triad).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;SUDDEN dyspnea + pleuritic chest pain, anxiety/“impending doom,” tachycardia, hypotension, hypoxemia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Laboratory Tests&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ABG (hypoxemia + resp alkalosis); D-dimer (elevated).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Diagnostic Procedures&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;CT pulmonary angiography (MDCTA) = GOLD STANDARD; V/Q scan alt.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Patient-Centered Care&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Care&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;OXYGEN FIRST (ABC), high-Fowler’s, q30-min respiratory checks, notify, then anticoagulate.&lt;/li&gt;&lt;li&gt;Bedrest initially; emotional reassurance.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Heparin → warfarin/DOAC; thrombolytics (alteplase) for massive PE.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Anticoagulation safety/labs; prevention (move, hydrate, SCDs).&lt;/li&gt;&lt;li&gt;Report bleeding, recurrence symptoms.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Safety Considerations&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;SAFETY —&lt;/b&gt; OXYGEN before heparin. Active peptic ulcer contraindicates heparin; a PRIOR DVT does NOT.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Right heart failure, shock, sudden death, infarction.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;section-divider&quot;&gt;&lt;h2 style=&quot;color:var(--gold);font-size:26px;border-bottom:3px solid var(--magenta);padding-bottom:10px;margin:30px 0 24px;&quot;&gt;🩺 Therapeutic &amp;amp; Diagnostic Procedures&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-thoracentesis&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Therapeutic Procedure · Mod 5&lt;/div&gt;&lt;h2&gt;Thoracentesis&lt;/h2&gt;&lt;/div&gt;

      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Thoracentesis&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Needle aspiration of fluid/air from the pleural space — diagnostic or therapeutic.&lt;/li&gt;&lt;li&gt;Removes effusion to relieve dyspnea or sample fluid.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pleural effusion, empyema, hemothorax; fluid analysis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Outcomes / Evaluation&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Improved breathing, ↑ breath sounds, relieved pressure; clear fluid analysis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Consent; baseline VS &amp;amp; breath sounds.&lt;/li&gt;&lt;li&gt;Position UPRIGHT leaning over bedside table.&lt;/li&gt;&lt;li&gt;Coagulation studies.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Client must stay STILL, no coughing/talking during.&lt;/li&gt;&lt;li&gt;Assist provider; maintain sterility; monitor.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;≤1 L removed at a time (re-expansion edema).&lt;/li&gt;&lt;li&gt;VS &amp;amp; breath sounds; watch for pneumothorax; chest x-ray after.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pneumothorax, re-expansion pulmonary edema, bleeding, infection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (priority/emergency)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;div&gt;Sudden dyspnea/chest pain after → suspect pneumothorax → notify, O₂, prepare for chest tube.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hold still during; report SOB or chest pain afterward.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-bronchoscopy&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Therapeutic Procedure · Mod 4&lt;/div&gt;&lt;h2&gt;Bronchoscopy&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Bronchoscopy&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Scope passed into the airways to visualize, biopsy, or remove secretions/foreign bodies.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Diagnosis (biopsy, cultures), secretion/foreign-body removal, airway evaluation.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Outcomes / Evaluation&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Diagnostic samples obtained; airway cleared; tolerated without complication.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Consent; NPO 4–8 hr (aspiration risk).&lt;/li&gt;&lt;li&gt;Baseline VS, SpO₂; remove dentures.&lt;/li&gt;&lt;li&gt;Atropine/sedation as ordered.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Monitor airway, SpO₂, VS; local anesthetic to throat.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Keep NPO until GAG REFLEX returns (ice chips first).&lt;/li&gt;&lt;li&gt;Monitor for bleeding, laryngospasm, fever, hypoxia.&lt;/li&gt;&lt;li&gt;Semi-Fowler’s.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Laryngospasm, bronchospasm, hemoptysis, hypoxia, pneumothorax, fever.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (priority/emergency)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;div&gt;Stridor/respiratory distress post-procedure → O₂, notify, prepare for airway support.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hoarse/sore throat is expected; don’t eat/drink until gag reflex returns; report bleeding or fever.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-mech-vent&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Therapeutic Procedure · Mod 5&lt;/div&gt;&lt;h2&gt;Mechanical Ventilation&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Mechanical Ventilation&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Ventilator delivers breaths via ET tube or trach when the client can’t ventilate/oxygenate adequately.&lt;/li&gt;&lt;li&gt;PEEP keeps alveoli open at end-expiration.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Respiratory failure, ARDS, apnea, airway protection, surgery.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Outcomes / Evaluation&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Adequate oxygenation/ventilation, vent synchrony, successful weaning.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Verify ET placement: end-tidal CO₂, bilateral breath sounds, CXR (definitive).&lt;/li&gt;&lt;li&gt;Cuff pressure 20–30 cm H₂O.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Never silence/ignore alarms.&lt;/li&gt;&lt;li&gt;HIGH-pressure = obstruction (secretions, kink, bite, pneumothorax).&lt;/li&gt;&lt;li&gt;LOW-pressure = leak/disconnection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;VAP bundle: HOB 30–45°, chlorhexidine oral care, daily sedation vacation, DVT &amp;amp; ulcer prophylaxis.&lt;/li&gt;&lt;li&gt;Suction PRN; monitor ABGs.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;VAP, barotrauma/pneumothorax (esp. high PEEP), oxygen toxicity, hypotension.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (priority/emergency)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;div&gt;Sudden distress → DOPE: Displacement, Obstruction, Pneumothorax, Equipment. Manually ventilate, call RT.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;(ICU/family.) Communication methods; explain alarms, suctioning, weaning trials.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-o2-therapy&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Therapeutic Procedure · Mod 4&lt;/div&gt;&lt;h2&gt;Oxygen Therapy &amp;amp; Delivery Devices&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Oxygen Therapy &amp;amp; Delivery Devices&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Supplemental O₂ to correct hypoxemia, matched to the device that gives the needed FiO₂.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hypoxemia, respiratory distress, increased O₂ demand.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Outcomes / Evaluation&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;SpO₂ at target (88–92% COPD; 95–100% most others), eased work of breathing.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess SpO₂, breath sounds; select device for needed FiO₂; safety check (no smoking/flames).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Nasal cannula 1–6 L (24–44%); simple mask 5–10 L (min 5 to flush CO₂).&lt;/li&gt;&lt;li&gt;Non-rebreather = highest without intubation; Venturi = MOST PRECISE (COPD).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Humidify ≥4 L; monitor SpO₂/ABG; skin care at contact points.&lt;/li&gt;&lt;li&gt;Titrate to target — don’t over-oxygenate COPD.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;O₂ toxicity (prolonged high FiO₂), drying/skin breakdown, suppressed drive in CO₂ retainers, FIRE risk.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (priority/emergency)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;div&gt;Distress on a working device → check tubing/flow/mask FIRST (stable client), then escalate.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;No smoking/open flame near O₂; home-O₂ safety; report worsening SOB.&lt;/li&gt;&lt;li&gt;COPD: don’t crank up the flow — 88–92% target.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-incentive-spiro&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Therapeutic Procedure · Mod 5&lt;/div&gt;&lt;h2&gt;Incentive Spirometry &amp;amp; Airway Clearance&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Incentive Spirometry &amp;amp; Airway Clearance&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 5&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Device encourages slow, deep breaths to expand alveoli and prevent/treat atelectasis.&lt;/li&gt;&lt;li&gt;Includes deep breathing, coughing, chest physiotherapy.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Post-op, immobility, atelectasis prevention, COPD, pneumonia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Outcomes / Evaluation&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Maintained lung expansion, clear breath sounds, no atelectasis, ↑ SpO₂.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Pain control first (so the client can breathe deeply); sit upright.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Seal lips, inhale SLOWLY &amp;amp; deeply, hold 3–5 sec, then cough.&lt;/li&gt;&lt;li&gt;Aim ~10 breaths/hr while awake.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Splint incision when coughing; document volumes/progress.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Dizziness/hyperventilation if too fast; ineffective if pain not controlled.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (priority/emergency)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;div&gt;(Low risk.) If lightheaded, pause and resume slower.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Use ~10×/hr awake; splint incision; the goal is prevention of pneumonia/atelectasis.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-abg&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Diagnostic Procedure · Mod 4&lt;/div&gt;&lt;h2&gt;Arterial Blood Gases (ABGs)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Arterial Blood Gases (ABGs)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 4&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Arterial sample (often radial) measuring pH, PaCO₂, PaO₂, HCO₃, SaO₂.&lt;/li&gt;&lt;li&gt;Evaluates oxygenation, ventilation, and acid–base balance.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Respiratory distress/failure, monitoring O₂/vent therapy, suspected acid–base imbalance.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interpretation of Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;pH 7.35–7.45 · PaCO₂ 35–45 (resp) · HCO₃ 22–26 (metab).&lt;/li&gt;&lt;li&gt;PaO₂ 80–100 · SaO₂ 95–100%.&lt;/li&gt;&lt;li&gt;ROME: Respiratory Opposite, Metabolic Equal.&lt;/li&gt;&lt;li&gt;Asthma: early = resp alkalosis; rising CO₂ = tiring → failure.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;ALLEN TEST before radial stick; note FiO₂/O₂ device on slip; don’t suction right before.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Arterial sample in heparinized syringe; expel air bubbles; label.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;POST&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Hold FIRM pressure ≥5 min (longer if anticoagulated).&lt;/li&gt;&lt;li&gt;Place on ICE, send promptly; assess site.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Potential Complications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bleeding/hematoma, arterial spasm/thrombosis, infection, nerve injury, false result if air/delay.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Expect a brief sharp stick; keep pressure on; report swelling/numbness/coolness.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;top-pft&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Diagnostic Procedure · Mod 6&lt;/div&gt;&lt;h2&gt;Pulmonary Function Tests (PFTs)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;PROCEDURE: &lt;span&gt;Pulmonary Function Tests (PFTs)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW MODULE CHAPTER: &lt;span&gt;Mod 6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box desc&quot;&gt;&lt;div class=&quot;h&quot;&gt;Description of Procedure&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Breathing tests measuring lung volumes and airflow (spirometry).&lt;/li&gt;&lt;li&gt;Key values: FEV₁, FVC, FEV₁/FVC ratio.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Indications&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Diagnose/monitor asthma &amp;amp; COPD, pre-op lung assessment, treatment response.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interpretation of Findings&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Obstructive (asthma/COPD): ↓ FEV₁, ↓ FEV₁/FVC.&lt;/li&gt;&lt;li&gt;Asthma: obstruction REVERSES with bronchodilator.&lt;/li&gt;&lt;li&gt;COPD: largely irreversible.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions (pre · intra · post)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;PRE&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;No bronchodilators before test (per order); no smoking/heavy meals before; rest.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div&gt;&lt;div class=&quot;kb&quot; style=&quot;font-weight:800;margin-bottom:4px;&quot;&gt;INTRA&lt;/div&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Tight lip seal on mouthpiece; follow coaching for max effort breaths.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

 &quot;q&quot;: &quot;A client diagnosed with a pulmonary embolism is prescribed a heparin infusion. Which actions should the nurse include in the plan of care? Select all that apply.&quot;,
 &quot;answer&quot;: [
  0,
  1,
  3,
  4
 ],
 &quot;rationale&quot;: &quot;Heparin is titrated to &lt;b&gt;aPTT&lt;/b&gt; (~1.5–2× normal); the nurse &lt;b&gt;assesses for bleeding&lt;/b&gt;, keeps the antidote &lt;b&gt;protamine sulfate&lt;/b&gt; available, and uses bleeding precautions like a &lt;b&gt;soft-bristle toothbrush&lt;/b&gt;. &lt;b&gt;IM injections are avoided&lt;/b&gt; (muscle hematoma risk). Also monitor a daily CBC/platelet count for heparin-induced thrombocytopenia (HIT).&quot;,
 &quot;takeaway&quot;: &quot;Heparin: aPTT + bleeding checks + protamine on hand + soft toothbrush. No IM. Watch platelets (HIT).&quot;,
 &quot;opts&quot;: [
  &quot;Monitor aPTT levels&quot;,
  &quot;Assess for signs of bleeding&quot;,
  &quot;Administer intramuscular injections as needed&quot;,
  &quot;Keep protamine sulfate available&quot;,
  &quot;Encourage use of a soft-bristle toothbrush&quot;
 ]
},
{
 &quot;fmt&quot;: &quot;mc&quot;,
 &quot;topic&quot;: &quot;Mod 6 · Lung Cancer&quot;,
 &quot;q&quot;: &quot;Which psychosocial intervention is MOST appropriate for the nurse to provide to a client newly diagnosed with lung cancer?&quot;,
 &quot;answer&quot;: [
  1
 ],
 &quot;rationale&quot;: &quot;A psychosocial intervention connects the client to &lt;b&gt;emotional support and external resources such as counseling&lt;/b&gt; — clients often hear little after the word \&quot;cancer.\&quot; High-intensity exercise is not psychosocial, advising secrecy is inappropriate, and focusing only on physical symptoms ignores the psychosocial need the question targets.&quot;,
 &quot;takeaway&quot;: &quot;Psychosocial = emotional support + counseling/resources, not physical care.&quot;,
 &quot;opts&quot;: [
  &quot;Encourage the client to join a high-intensity exercise program&quot;,
  &quot;Provide emotional support and facilitate access to counseling services&quot;,
  &quot;Advise the client to avoid discussing the diagnosis with family and friends&quot;,
  &quot;Focus solely on the client's physical symptoms and treatment plan&quot;
 ]
},
{
 &quot;fmt&quot;: &quot;sata&quot;,
 &quot;topic&quot;: &quot;Mod 6 · Lung Cancer&quot;,
 &quot;q&quot;: &quot;The nurse is assessing a client with suspected lung cancer. Which findings indicate ADVANCED disease or complications associated with lung cancer? Select all that apply.&quot;,
 &quot;answer&quot;: [
  0,
  1,
  2,
  3
 ],
 &quot;rationale&quot;: &quot;Lung cancer commonly metastasizes to the &lt;b&gt;liver&lt;/b&gt; (jaundice), &lt;b&gt;bone&lt;/b&gt; (thoracic spine pain), &lt;b&gt;lymph nodes&lt;/b&gt; (enlarged cervical nodes), and &lt;b&gt;brain&lt;/b&gt; (seizures). Seizures may also stem from &lt;b&gt;SIADH-related hyponatremia&lt;/b&gt; (some lung cancers secrete ADH). Acute fever and chills indicate infection, not advanced cancer.&quot;,
 &quot;takeaway&quot;: &quot;Lung CA spreads to liver/bone/brain/nodes → jaundice, bone pain, seizures, cervical nodes. Fever = infection.&quot;,
 &quot;opts&quot;: [
  &quot;New onset of jaundice&quot;,
  &quot;Thoracic spine bone pain&quot;,
  &quot;Enlarged cervical lymph nodes&quot;,
  &quot;Onset of tonic-clonic seizures&quot;,
  &quot;Acute onset of fever and chills&quot;
 ]
},
{
 &quot;fmt&quot;: &quot;mc&quot;,
 &quot;topic&quot;: &quot;Mod 6 · Lung Cancer (SVC Syndrome)&quot;,
 &quot;q&quot;: &quot;A client with known lung cancer presents with facial swelling, distended neck veins, and dyspnea. Which action should the nurse complete FIRST?&quot;,
 &quot;answer&quot;: [
  0
 ],
 &quot;rationale&quot;: &quot;Facial swelling, distended neck veins, and dyspnea signal &lt;b&gt;superior vena cava (SVC) syndrome&lt;/b&gt;, an oncologic emergency where the tumor compresses the SVC and blocks venous return from the head. &lt;b&gt;Elevating the head of the bed&lt;/b&gt; uses gravity to improve drainage immediately; definitive treatment (radiation, IV corticosteroids) follows. Opioids, bronchoscopy, and sputum cultures don't address the obstruction.&quot;,
 &quot;takeaway&quot;: &quot;Facial swelling + distended neck veins + dyspnea in lung CA = SVC syndrome → raise HOB first.&quot;,
 &quot;opts&quot;: [
  &quot;Elevate the head of the bed&quot;,
  &quot;Administer prescribed opioids&quot;,
  &quot;Prepare the client for bronchoscopy&quot;,
  &quot;Obtain sputum cultures&quot;
 ]
},
{
 &quot;fmt&quot;: &quot;mc&quot;,
 &quot;topic&quot;: &quot;Mod 6 · Asthma&quot;,
 &quot;q&quot;: &quot;A client presents to the ED with dyspnea, nasal flaring, accessory muscle use, a respiratory rate of 35/min, and a history of asthma. Which intervention should the nurse complete FIRST?&quot;,
 &quot;answer&quot;: [
  1
 ],
 &quot;rationale&quot;: &quot;This is an acute asthma exacerbation (&lt;b&gt;bronchoconstriction&lt;/b&gt;) — an airway/breathing emergency. A &lt;b&gt;short-acting beta agonist&lt;/b&gt; (e.g., albuterol) is the rescue medication that opens the airways fastest. A chest x-ray adds nothing acutely, an ABG can wait, and IV corticosteroids take 6–12 hours to work — not the first action.&quot;,
 &quot;takeaway&quot;: &quot;Acute asthma → SABA (albuterol) first. Steroids help later (6–12 hr onset).&quot;,
 &quot;opts&quot;: [
  &quot;Rapidly arrange and obtain a chest x-ray&quot;,
  &quot;Administer a short-acting beta agonist as prescribed&quot;,
  &quot;Facilitate obtaining an ABG level&quot;,
  &quot;Administer an IV corticosteroid as prescribed&quot;
 ]
}
];

/* ============== STATE ============== */
let idx = 0;
let answered = [];        // bool per question
let correctFlags = [];    // bool per question
let curSel = [];          // selected option indices (mc/sata)
let curOrder = [];        // current order (ordering)
let locked = false;
let started = false;

const app = document.getElementById(&quot;app&quot;);
const FMT_LABEL = {mc:&quot;Multiple Choice&quot;, sata:&quot;Select All That Apply&quot;, order:&quot;Put in Order&quot;};
const KEYS = [&quot;A&quot;,&quot;B&quot;,&quot;C&quot;,&quot;D&quot;,&quot;E&quot;,&quot;F&quot;,&quot;G&quot;];

function arraysEqual(a,b){ if(a.length!==b.length) return false; for(let i=0;i&lt;a.length;i++) if(a[i]!==b[i]) return false; return true; }
function sortedEqual(a,b){ const x=[...a].sort((m,n)=&gt;m-n), y=[...b].sort((m,n)=&gt;m-n); return arraysEqual(x,y); }

/* ============== RENDER ============== */
// derive category groups from topics
function topicGroup(t){
  const head = t.split(&quot;·&quot;)[0].trim();
  return head;
}
let activePool = QUESTIONS.slice();
let shuffleOn = true;
let selectedGroups = new Set();

function renderStart(){
  const groups = {};
  QUESTIONS.forEach((q,i)=&gt;{ const g=topicGroup(q.topic); (groups[g]=groups[g]||[]).push(i); });
  const order = [&quot;Foundations&quot;,&quot;Mod 4&quot;,&quot;Mod 5&quot;,&quot;Mod 6&quot;,&quot;Meds&quot;,&quot;NGN&quot;];
  const present = order.filter(g=&gt;groups[g]);
  const groupBtns = present.map(g=&gt;
    `&lt;button class=&quot;btn btn-ghost filter-btn&quot; data-g=&quot;${g}&quot; onclick=&quot;toggleGroup('${g}')&quot;&gt;${g} &lt;span class=&quot;cnt&quot;&gt;${groups[g].length}&lt;/span&gt;&lt;/button&gt;`
  ).join(&quot;&quot;);

  app.innerHTML = `
    &lt;div class=&quot;q-card start-card&quot;&gt;
      &lt;div class=&quot;big&quot;&gt;A &lt;b&gt;${QUESTIONS.length}-question&lt;/b&gt; NCLEX-style quiz covering every Module 4–6 topic.&lt;br&gt;Rationale &amp;amp; takeaway after each one.&lt;/div&gt;
      &lt;div class=&quot;legend&quot;&gt;
        &lt;span class=&quot;fmt mc&quot;&gt;Multiple Choice&lt;/span&gt;
        &lt;span class=&quot;fmt sata&quot;&gt;Select All&lt;/span&gt;
        &lt;span class=&quot;fmt order&quot;&gt;Put in Order&lt;/span&gt;
      &lt;/div&gt;
      &lt;div style=&quot;margin:20px 0 8px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.4px;&quot;&gt;TAP TO PICK SECTIONS (or leave all on)&lt;/div&gt;
      &lt;div class=&quot;filter-row&quot;&gt;${groupBtns}&lt;/div&gt;
      &lt;div id=&quot;poolInfo&quot; style=&quot;font-size:14px;color:var(--gold-soft);margin:14px 0 4px;font-weight:700;&quot;&gt;&lt;/div&gt;
      &lt;label class=&quot;shuffle-row&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;shuf&quot; checked onchange=&quot;shuffleOn=this.checked&quot;&gt; Shuffle question order&lt;/label&gt;
      &lt;div class=&quot;actions&quot; style=&quot;justify-content:center;margin-top:18px;&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;startQuiz()&quot;&gt;Start →&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  selectedGroups = new Set(present);
  refreshFilterUI();
}

function toggleGroup(g){
  if(selectedGroups.has(g)) selectedGroups.delete(g); else selectedGroups.add(g);
  if(selectedGroups.size===0) selectedGroups.add(g);
  refreshFilterUI();
}
function refreshFilterUI(){
  document.querySelectorAll(&quot;.filter-btn&quot;).forEach(b=&gt;{
    if(selectedGroups.has(b.dataset.g)) b.classList.add(&quot;on&quot;); else b.classList.remove(&quot;on&quot;);
  });
  const pool = QUESTIONS.filter(q=&gt;selectedGroups.has(topicGroup(q.topic)));
  const all = selectedGroups.size&gt;=6;
  const info=document.getElementById(&quot;poolInfo&quot;);
  if(info) info.textContent = (all?&quot;All sections · &quot;:&quot;Selected · &quot;) + pool.length + &quot; questions&quot;;
}

function renderProgress(){
  const pct = Math.round((idx)/activePool.length*100);
  const score = correctFlags.filter(Boolean).length;
  return `
    &lt;div class=&quot;bar-wrap&quot;&gt;
      &lt;div class=&quot;bar-track&quot;&gt;&lt;div class=&quot;bar-fill&quot; style=&quot;width:${pct}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;bar-label&quot;&gt;&lt;span&gt;Question &lt;b&gt;${idx+1}&lt;/b&gt; of ${QUESTIONS.length}&lt;/span&gt;&lt;span&gt;Score: &lt;b&gt;${score}&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;`;
}

function renderQuestion(){
  const Q = activePool[idx];
  let optsHTML = &quot;&quot;;

  if(Q.fmt === &quot;order&quot;){
    optsHTML = `&lt;div class=&quot;order-list&quot; id=&quot;orderList&quot;&gt;` +
      curOrder.map((origIdx,pos)=&gt;{
        let cls = &quot;order-item&quot;;
        if(locked){ cls += (curOrder[pos]===Q.answer[pos]) ? &quot; ok locked&quot; : &quot; no locked&quot;; }
        return `&lt;div class=&quot;${cls}&quot; draggable=&quot;${!locked}&quot; data-pos=&quot;${pos}&quot;&gt;
          &lt;span class=&quot;grip&quot;&gt;⠿&lt;/span&gt;&lt;span class=&quot;pos&quot;&gt;${pos+1}&lt;/span&gt;
          &lt;span class=&quot;txt&quot;&gt;${Q.items[origIdx]}&lt;/span&gt;
        &lt;/div&gt;`;
      }).join(&quot;&quot;) + `&lt;/div&gt;`;
  } else {
    optsHTML = `&lt;div class=&quot;opts&quot;&gt;` + Q.opts.map((o,i)=&gt;{
      let cls = &quot;opt&quot;;
      const isSel = curSel.includes(i);
      const isAns = Q.answer.includes(i);
      let mark = &quot;&quot;;
      if(locked){
        cls += &quot; locked&quot;;
        if(isAns){ cls += &quot; correct&quot;; mark = &quot;✓&quot;; }
        else if(isSel){ cls += &quot; wrong&quot;; mark = &quot;✗&quot;; }
      } else if(isSel){ cls += &quot; sel&quot;; }
      return `&lt;button class=&quot;${cls}&quot; onclick=&quot;toggleOpt(${i})&quot; ${locked?&quot;disabled&quot;:&quot;&quot;}&gt;
        &lt;span class=&quot;key&quot;&gt;${KEYS[i]}&lt;/span&gt;&lt;span&gt;${o}&lt;/span&gt;
        ${mark?`&lt;span class=&quot;mark&quot;&gt;${mark}&lt;/span&gt;`:&quot;&quot;}
      &lt;/button&gt;`;
    }).join(&quot;&quot;) + `&lt;/div&gt;`;
  }

  const hint = Q.fmt===&quot;sata&quot; ? &quot;Select all that apply, then submit.&quot; :
               Q.fmt===&quot;order&quot; ? &quot;Drag the items into the correct order, then submit.&quot; :
               &quot;Choose the best answer.&quot;;

  let actionsHTML = &quot;&quot;;
  if(!locked){
    actionsHTML = `&lt;div class=&quot;actions&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; id=&quot;submitBtn&quot; onclick=&quot;submit()&quot; ${curSel.length===0 &amp;&amp; Q.fmt!==&quot;order&quot; ? &quot;disabled&quot;:&quot;&quot;}&gt;Submit answer&lt;/button&gt;
    &lt;/div&gt;`;
  } else {
    const last = idx === activePool.length-1;
    actionsHTML = `&lt;div class=&quot;actions&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;next()&quot;&gt;${last?&quot;See results →&quot;:&quot;Next question →&quot;}&lt;/button&gt;
    &lt;/div&gt;`;
  }

  let rationaleHTML = &quot;&quot;;
  if(locked){
    const Q2 = activePool[idx];
    const ok = correctFlags[idx];
    rationaleHTML = `&lt;div class=&quot;rationale ${ok?&quot;right&quot;:&quot;wrong-r&quot;}&quot;&gt;
      &lt;div class=&quot;verdict&quot;&gt;${ok?&quot;✓ Correct&quot;:&quot;✗ Not quite&quot;}&lt;/div&gt;
      &lt;div&gt;${Q2.rationale}&lt;/div&gt;
      ${Q2.takeaway ? `&lt;div class=&quot;takeaway&quot;&gt;&lt;b&gt;Takeaway:&lt;/b&gt; ${Q2.takeaway}&lt;/div&gt;` : &quot;&quot;}
    &lt;/div&gt;`;
  }

  app.innerHTML = renderProgress() + `
    &lt;div class=&quot;q-card&quot;&gt;
      &lt;div class=&quot;q-meta&quot;&gt;
        &lt;span class=&quot;q-num&quot;&gt;Q${idx+1}&lt;/span&gt;
        &lt;span class=&quot;fmt ${Q.fmt}&quot;&gt;${FMT_LABEL[Q.fmt]}&lt;/span&gt;
        &lt;span class=&quot;topic-pill&quot;&gt;${Q.topic}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;q-text&quot;&gt;${Q.q}&lt;/div&gt;
      &lt;div class=&quot;q-hint&quot;&gt;${hint}&lt;/div&gt;
      ${optsHTML}
      ${rationaleHTML}
      ${actionsHTML}
    &lt;/div&gt;`;

  if(Q.fmt===&quot;order&quot; &amp;&amp; !locked) attachDrag();
}

/* ============== INTERACTIONS ============== */
function startQuiz(){
  // build pool from selected groups
  activePool = QUESTIONS.filter(q=&gt;selectedGroups.has(topicGroup(q.topic)));
  if(activePool.length===0) activePool = QUESTIONS.slice();
  if(shuffleOn){
    for(let i=activePool.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [activePool[i],activePool[j]]=[activePool[j],activePool[i]]; }
  }
  started=true; idx=0; answered=[]; correctFlags=[]; loadQuestion();
}
function loadQuestion(){
  locked=false; curSel=[];
  const Q=activePool[idx];
  if(Q.fmt===&quot;order&quot;){ curOrder = Q.items.map((_,i)=&gt;i); shuffle(curOrder); }
  renderQuestion();
}
function shuffle(a){ for(let i=a.length-1;i&gt;0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } 
  // ensure not already fully correct
  const Q=activePool[idx];
  if(Q &amp;&amp; Q.answer &amp;&amp; arraysEqual(a,Q.answer)) [a[0],a[1]]=[a[1],a[0]];
}

function toggleOpt(i){
  if(locked) return;
  const Q=activePool[idx];
  if(Q.fmt===&quot;sata&quot;){
    const p=curSel.indexOf(i);
    if(p&gt;=0) curSel.splice(p,1); else curSel.push(i);
  } else {
    curSel=[i];
  }
  renderQuestion();
}

function submit(){
  const Q=activePool[idx];
  let correct=false;
  if(Q.fmt===&quot;order&quot;){ correct = arraysEqual(curOrder,Q.answer); }
  else { correct = sortedEqual(curSel,Q.answer); }
  answered[idx]=true; correctFlags[idx]=correct; locked=true;
  renderQuestion();
}

function next(){
  if(idx===activePool.length-1){ renderResults(); }
  else { idx++; loadQuestion(); window.scrollTo({top:0,behavior:&quot;smooth&quot;}); }
}

/* ---- drag &amp; drop for ordering ---- */
let dragFrom=null;
function attachDrag(){
  const list=document.getElementById(&quot;orderList&quot;);
  const items=[...list.querySelectorAll(&quot;.order-item&quot;)];
  items.forEach(el=&gt;{
    el.addEventListener(&quot;dragstart&quot;,e=&gt;{ dragFrom=+el.dataset.pos; el.classList.add(&quot;dragging&quot;); });
    el.addEventListener(&quot;dragend&quot;,e=&gt;{ el.classList.remove(&quot;dragging&quot;); });
    el.addEventListener(&quot;dragover&quot;,e=&gt;{ e.preventDefault(); });
    el.addEventListener(&quot;drop&quot;,e=&gt;{
      e.preventDefault();
      const to=+el.dataset.pos;
      if(dragFrom===null||dragFrom===to) return;
      const moved=curOrder.splice(dragFrom,1)[0];
      curOrder.splice(to,0,moved);
      dragFrom=null;
      renderQuestion();
    });
  });
  // touch support: tap two items to swap
  let tapFirst=null;
  items.forEach(el=&gt;{
    el.addEventListener(&quot;click&quot;,()=&gt;{
      if(locked) return;
      const pos=+el.dataset.pos;
      if(tapFirst===null){ tapFirst=pos; el.style.outline=&quot;2px solid var(--magenta)&quot;; }
      else{
        [curOrder[tapFirst],curOrder[pos]]=[curOrder[pos],curOrder[tapFirst]];
        tapFirst=null; renderQuestion();
      }
    });
  });
}

/* ============== RESULTS ============== */
function renderResults(){
  const score=correctFlags.filter(Boolean).length;
  const total=activePool.length;
  const pct=Math.round(score/total*100);
  let msg, emoji;
  if(pct&gt;=90){ msg=&quot;Outstanding — you've got this cold.&quot;; emoji=&quot;🌟&quot;; }
  else if(pct&gt;=80){ msg=&quot;Strong work — exam-ready on most of this.&quot;; emoji=&quot;💪&quot;; }
  else if(pct&gt;=70){ msg=&quot;Solid pass — review the misses and you're there.&quot;; emoji=&quot;👍&quot;; }
  else{ msg=&quot;Good practice — focus your review on the missed topics below.&quot;; emoji=&quot;📚&quot;; }

  const review = activePool.map((Q,i)=&gt;{
    const ok=correctFlags[i];
    return `&lt;div class=&quot;review-item ${ok?&quot;r&quot;:&quot;w&quot;}&quot;&gt;
      &lt;span class=&quot;ri-mark&quot;&gt;${ok?&quot;✓&quot;:&quot;✗&quot;}&lt;/span&gt;
      &lt;span&gt;&lt;b&gt;Q${i+1}.&lt;/b&gt; ${Q.topic}&lt;/span&gt;
    &lt;/div&gt;`;
  }).join(&quot;&quot;);

  app.innerHTML = `
    &lt;div class=&quot;q-card results&quot;&gt;
      &lt;div style=&quot;font-size:40px;&quot;&gt;${emoji}&lt;/div&gt;
      &lt;div class=&quot;score-ring&quot;&gt;${pct}%&lt;/div&gt;
      &lt;div class=&quot;score-sub&quot;&gt;${score} of ${total} correct&lt;/div&gt;
      &lt;div class=&quot;score-msg&quot;&gt;${msg}&lt;/div&gt;
      &lt;div class=&quot;review-list&quot;&gt;${review}&lt;/div&gt;
      &lt;div class=&quot;actions&quot; style=&quot;justify-content:center;margin-top:22px;&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;startQuiz()&quot;&gt;Retake quiz ↻&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;reviewMissed()&quot;&gt;Review missed only&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
  window.scrollTo({top:0,behavior:&quot;smooth&quot;});
}

function reviewMissed(){
  const missed = activePool.map((Q,i)=&gt;({Q,i})).filter(x=&gt;!correctFlags[x.i]);
  if(missed.length===0){
    app.innerHTML = `&lt;div class=&quot;q-card results&quot;&gt;&lt;div style=&quot;font-size:40px;&quot;&gt;🎉&lt;/div&gt;
      &lt;div class=&quot;score-msg&quot;&gt;You didn't miss any — nothing to review!&lt;/div&gt;
      &lt;div class=&quot;actions&quot; style=&quot;justify-content:center;&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; onclick=&quot;startQuiz()&quot;&gt;Retake quiz ↻&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
    return;
  }
  const blocks = missed.map(({Q,i})=&gt;`
    &lt;div class=&quot;q-card&quot; style=&quot;margin-top:14px;&quot;&gt;
      &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q${i+1}&lt;/span&gt;&lt;span class=&quot;topic-pill&quot;&gt;${Q.topic}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;q-text&quot; style=&quot;font-size:16.5px;&quot;&gt;${Q.q}&lt;/div&gt;
      &lt;div class=&quot;rationale right&quot; style=&quot;margin-top:12px;&quot;&gt;
        &lt;div class=&quot;verdict&quot; style=&quot;color:var(--green-soft);&quot;&gt;Correct answer &amp;amp; why&lt;/div&gt;
        &lt;div&gt;${Q.rationale}&lt;/div&gt;
        ${Q.takeaway ? `&lt;div class=&quot;takeaway&quot;&gt;&lt;b&gt;Takeaway:&lt;/b&gt; ${Q.takeaway}&lt;/div&gt;` : &quot;&quot;}
      &lt;/div&gt;
    &lt;/div&gt;`).join(&quot;&quot;);
  app.innerHTML = `&lt;div style=&quot;text-align:center;margin-bottom:6px;&quot;&gt;
      &lt;div class=&quot;score-msg&quot;&gt;Reviewing ${missed.length} missed question${missed.length&gt;1?&quot;s&quot;:&quot;&quot;}&lt;/div&gt;
    &lt;/div&gt;` + blocks + `
    &lt;div class=&quot;actions&quot; style=&quot;justify-content:center;margin-top:18px;&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;startQuiz()&quot;&gt;Retake full quiz ↻&lt;/button&gt;
    &lt;/div&gt;`;
  window.scrollTo({top:0,behavior:&quot;smooth&quot;});
}

/* ============== INIT ============== */
renderStart();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></div>
<script>
 var tabs=document.querySelectorAll('.tab'), frames=document.querySelectorAll('.tf');
 tabs.forEach(function(t){t.addEventListener('click',function(){
   var id=t.dataset.tab;
   tabs.forEach(function(x){x.classList.toggle('active',x===t);});
   frames.forEach(function(f){f.classList.toggle('show',f.dataset.tab===id);});
 });});
</script>
