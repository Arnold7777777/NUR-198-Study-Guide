&lt;div class=&quot;subhead&quot;&gt;🫁 Atelectasis &lt;span class=&quot;hi-pill&quot;&gt;New · High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;What it is&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Collapse of alveoli&lt;/b&gt; — mucus/fluid trapped or alveoli not opening → decreased gas exchange.&lt;/li&gt;
    &lt;li&gt;#1 post-op pulmonary complication, especially with &lt;b&gt;shallow breathing + immobility&lt;/b&gt;.&lt;/li&gt;
    &lt;li&gt;Signs: ↓ breath sounds, dyspnea, ↓ SpO₂, low-grade fever, tachycardia.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Prevention &amp;amp; care (first-line)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;Incentive spirometry&lt;/span&gt; + deep breathing &amp;amp; coughing.&lt;/li&gt;
    &lt;li&gt;Early ambulation; frequent repositioning (turn q2h).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Semi-Fowler's&lt;/b&gt; instead of flat/supine.&lt;/li&gt;
    &lt;li&gt;Escalate to IPPB / PEEP / bronchoscopy only if first-line measures fail.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🦠 Pneumonia &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Types&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Definition&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;CAP&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Community-acquired — most common.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;HAP&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Hospital-acquired — fever/cough &amp;gt;48 hr after admission.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;VAP&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Ventilator-associated — &amp;gt;48 hr after intubation.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;HCAP&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Healthcare-associated — resistant organisms.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Diagnostics&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Sputum culture BEFORE antibiotics&lt;/span&gt; (most important!).&lt;/li&gt;
    &lt;li&gt;CXR: consolidation (white/opaque area).&lt;/li&gt;
    &lt;li&gt;CBC, ABGs, blood cultures, pulse oximetry.&lt;/li&gt;
    &lt;li&gt;Dull percussion over consolidated (fluid-filled) area.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;👵 Older Adults — Atypical Presentation&lt;/span&gt;
Pneumonia in older adults often shows &lt;b&gt;confusion / disorientation FIRST&lt;/b&gt; — not fever or cough. Any acute confusion in
an older adult → assess for infection (UA, CXR, CBC). Vital-sign changes (including fever) may be blunted.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Clinical manifestations&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Fever, chills, tachypnea, tachycardia.&lt;/li&gt;
    &lt;li&gt;Productive cough: &lt;span class=&quot;hl&quot;&gt;yellow / rust-colored sputum&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;Pleuritic chest pain (worse with breathing).&lt;/li&gt;
    &lt;li&gt;Crackles; dull percussion; ↓ SpO₂; diaphoresis.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Management&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Position: High-Fowler's 90°&lt;/b&gt; — maximizes ventilation.&lt;/li&gt;
    &lt;li&gt;O₂ therapy; IV antibiotics → oral when improving.&lt;/li&gt;
    &lt;li&gt;Fluids 2–3 L/day; coughing/deep breathing; incentive spirometry.&lt;/li&gt;
    &lt;li&gt;Influenza + pneumococcal vaccines for prevention.&lt;/li&gt;
    &lt;li&gt;Complications: atelectasis, bacteremia/sepsis, ARDS.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🧫 Tuberculosis (TB) &lt;span class=&quot;hi-pill&quot;&gt;Isolation — Airborne&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🔴 Airborne Precautions — non-negotiable&lt;/span&gt;
&lt;b&gt;Negative-pressure room&lt;/b&gt; (air flows IN, not out) · &lt;b&gt;N95/HEPA respirator&lt;/b&gt; for staff ·
&lt;b&gt;Surgical mask on the client&lt;/b&gt; for transport · door stays closed.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Mantoux (TST) reading&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Read at &lt;b&gt;48–72 hr&lt;/b&gt;; measure &lt;b&gt;INDURATION&lt;/b&gt; (firm raised area), NOT redness.&lt;/li&gt;&lt;/ul&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:6px 0 0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Positive if ≥&lt;/th&gt;&lt;th&gt;Population&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td class=&quot;hl&quot;&gt;5 mm&lt;/td&gt;&lt;td&gt;High risk: HIV+, transplant, close TB contact, CXR evidence.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td class=&quot;hl&quot;&gt;10 mm&lt;/td&gt;&lt;td&gt;Moderate: healthcare workers, immigrants, prisoners, homeless, IV drug users.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td class=&quot;hl&quot;&gt;15 mm&lt;/td&gt;&lt;td&gt;Low risk: no known risk factors.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;
  &lt;p style=&quot;font-size:13.5px;color:#a99fc7;margin:8px 0 0&quot;&gt;A positive test = &lt;b&gt;exposure&lt;/b&gt;, not active disease. Confirm active TB with sputum cultures + CXR.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Features &amp;amp; diagnostics&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Classic triad: &lt;span class=&quot;hl&quot;&gt;productive cough, night sweats, weight loss&lt;/span&gt;.&lt;/li&gt;
    &lt;li&gt;Fatigue, low-grade fever, hemoptysis.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Definitive / no-longer-infectious:&lt;/b&gt; 3 consecutive negative sputum cultures.&lt;/li&gt;
    &lt;li&gt;Check sputum q2–4 weeks while on treatment.&lt;/li&gt;
    &lt;li&gt;IGRA blood test (QuantiFERON-TB): no booster effect, one visit.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;💊 RIPE Regimen — 6–12 months, all 4 together&lt;/span&gt;
&lt;b&gt;R&lt;/b&gt;ifampin + &lt;b&gt;I&lt;/b&gt;soniazid + &lt;b&gt;P&lt;/b&gt;yrazinamide + &lt;b&gt;E&lt;/b&gt;thambutol&lt;/div&gt;
&lt;table class=&quot;t&quot;&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Drug&lt;/th&gt;&lt;th&gt;Key side effects&lt;/th&gt;&lt;th&gt;Critical nursing points&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Isoniazid (INH)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Hepatotoxicity, &lt;span class=&quot;hl-r&quot;&gt;neurotoxicity&lt;/span&gt; (tingling hands/feet)&lt;/td&gt;&lt;td&gt;Give &lt;span class=&quot;hl-g&quot;&gt;vitamin B6 (pyridoxine)&lt;/span&gt; to prevent neuropathy; NO alcohol; monthly LFTs; empty stomach.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Rifampin (RIF)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl-r&quot;&gt;Orange urine &amp;amp; secretions&lt;/span&gt;, hepatotoxicity&lt;/td&gt;&lt;td&gt;Warn about discoloration (expected, don't stop); reduces OCP effect (backup contraception); discolors contacts; monthly LFTs.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Pyrazinamide (PZA)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Hepatotoxicity, &lt;span class=&quot;hl-r&quot;&gt;joint pain&lt;/span&gt; (gout)&lt;/td&gt;&lt;td&gt;LFTs q2 weeks; assess gout history; plenty of water; NO alcohol.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;b&gt;Ethambutol (EMB)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl-r&quot;&gt;OCULAR toxicity&lt;/span&gt; (color vision &amp;amp; acuity)&lt;/td&gt;&lt;td&gt;Baseline + monthly vision test; &lt;b&gt;STOP immediately if ANY eye changes&lt;/b&gt;; avoid in children &amp;lt;8.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧭 RIPE Memory — &quot;RIP Eyes&quot;&lt;/span&gt;
&lt;b&gt;R&lt;/b&gt;ed pee (Rifampin) · &lt;b&gt;I&lt;/b&gt;nterference with nerves → B6 (INH) · &lt;b&gt;P&lt;/b&gt;ain in joints (PZA) · &lt;b&gt;E&lt;/b&gt;yes = stop now (Ethambutol).&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — TB Meds&lt;/span&gt;
Orange urine = Rifampin (warn ahead, do NOT stop). Tingling hands = INH → treat with B6 (don't stop). Vision changes =
Ethambutol → STOP immediately (no B6 fix). Joint pain = Pyrazinamide (not INH).&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🆘 Acute Respiratory Failure (ARF) &amp;amp; ARDS &lt;span class=&quot;hi-pill&quot;&gt;Critical&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🫁 ARF&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;ABG criteria:&lt;/b&gt; PaO₂ &amp;lt;60 OR PaCO₂ &amp;gt;50 with pH &amp;lt;7.35, AND SaO₂ &amp;lt;90%.&lt;/li&gt;
    &lt;li&gt;Types: ventilatory failure · oxygenation failure (V/Q mismatch) · combined.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Priority:&lt;/b&gt; maintain airway → mechanical ventilation with PEEP/CPAP often required.&lt;/li&gt;
    &lt;li&gt;Causes: COPD exacerbation, pneumonia, PE, neuromuscular disease, drug OD.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🌫️ ARDS&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Causes: sepsis, burns, aspiration, trauma, near-drowning, multiple transfusions, drug toxicity, SARS-CoV-2.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Hallmark: severe hypoxemia DESPITE 100% O₂&lt;/span&gt; + bilateral ground-glass infiltrates on CXR.&lt;/li&gt;
    &lt;li&gt;Patho: alveolar-capillary damage → fluid fills alveoli → gas exchange critically impaired.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Tx:&lt;/b&gt; mech vent + PEEP · prone positioning 4–16 hr/day · limit FiO₂ · conservative fluids.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🔴 BNP — differentiate ARDS vs. cardiac pulmonary edema&lt;/span&gt;
BNP (brain natriuretic peptide) tells the two apart. &lt;b&gt;Normal BNP = ARDS&lt;/b&gt; (non-cardiac). &lt;b&gt;Elevated BNP = cardiac origin&lt;/b&gt;. Key early diagnostic test.&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — Vecuronium (neuromuscular blocker)&lt;/span&gt;
Vecuronium &lt;b&gt;paralyzes&lt;/b&gt; muscles to allow ventilation — it does NOT sedate, treat infection, or reduce anxiety. The
paralyzed client is fully conscious and can feel pain. &lt;b&gt;Always co-administer sedation (propofol, midazolam) AND analgesia (morphine, fentanyl).&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;💧 Pulmonary Edema &lt;span class=&quot;hi-pill&quot;&gt;New&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Patho &amp;amp; signs&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Fluid leaks into alveoli → impaired gas exchange. &lt;b&gt;Cardiogenic&lt;/b&gt; (left heart failure) or &lt;b&gt;non-cardiogenic&lt;/b&gt; (ARDS).&lt;/li&gt;
    &lt;li&gt;Severe dyspnea, orthopnea, &lt;span class=&quot;hl-r&quot;&gt;pink frothy sputum&lt;/span&gt;, crackles, anxiety, restlessness.&lt;/li&gt;
    &lt;li&gt;Tachycardia, hypoxemia, cool clammy skin, &quot;feeling of suffocation.&quot;&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Priority care&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;High-Fowler's, legs dependent&lt;/b&gt; (reduces venous return / preload).&lt;/li&gt;
    &lt;li&gt;O₂ (high-flow / CPAP/BiPAP); continuous monitoring.&lt;/li&gt;
    &lt;li&gt;Cardiogenic meds: &lt;span class=&quot;hl-g&quot;&gt;diuretics (furosemide)&lt;/span&gt;, vasodilators (nitroglycerin), morphine (anxiety + preload).&lt;/li&gt;
    &lt;li&gt;Daily weights, strict I&amp;amp;O, monitor K+ with diuretics.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;💢 Pneumothorax &amp;amp; Hemothorax &lt;span class=&quot;hi-pill&quot;&gt;Emergency&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Pneumothorax vs. Hemothorax&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Feature&lt;/th&gt;&lt;th&gt;Pneumo (air)&lt;/th&gt;&lt;th&gt;Hemo (blood)&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Percussion&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;Hyperresonant&lt;/td&gt;&lt;td&gt;Dull&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Cause&lt;/td&gt;&lt;td&gt;Spontaneous, trauma, procedure&lt;/td&gt;&lt;td&gt;Trauma (MVA, GSW)&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Breath sounds&lt;/td&gt;&lt;td&gt;Absent/↓ affected side&lt;/td&gt;&lt;td&gt;Absent/↓ affected side&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Treatment&lt;/td&gt;&lt;td&gt;Chest tube, O₂&lt;/td&gt;&lt;td&gt;Chest tube + blood replacement&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🆘 Tension Pneumothorax — emergency&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;Tracheal deviation toward the UNAFFECTED side.&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Absent breath sounds + distended neck veins (JVD).&lt;/li&gt;
    &lt;li&gt;Hemodynamic instability: hypotension, tachycardia.&lt;/li&gt;
    &lt;li&gt;Tracheal deviation is a &lt;b&gt;late&lt;/b&gt; finding — don't wait for it.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Tx: needle decompression FIRST&lt;/b&gt; (14G, 2nd ICS, midclavicular) → then chest tube.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ SNAP — Tension vs. Spontaneous Pneumothorax&lt;/span&gt;
&lt;b&gt;Spontaneous PTX:&lt;/b&gt; sudden pleuritic pain + dyspnea → CXR → chest tube.
&lt;b&gt;Tension PTX:&lt;/b&gt; same + tracheal deviation AWAY from affected side + JVD + shock → &lt;b&gt;needle decompression NOW&lt;/b&gt; → then chest tube.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🎖️ Flail Chest&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;≥2 neighboring ribs with multiple fractures each.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Paradoxical movement:&lt;/span&gt; chest moves IN on inspiration, OUT on expiration.&lt;/li&gt;
    &lt;li&gt;Cause: blunt trauma (MVA); possible during vigorous CPR in older adults.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Tx:&lt;/b&gt; positive-pressure mechanical ventilation (stabilizes chest) · O₂ · epidural/PCA analgesia.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;💦 Pleural Effusion &amp;amp; Empyema&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;Effusion:&lt;/b&gt; excess fluid in pleural space → dyspnea, dull percussion, ↓ breath sounds.&lt;/li&gt;
    &lt;li&gt;Tx: thoracentesis (max 1 L at a time to prevent re-expansion edema).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Empyema:&lt;/b&gt; pus in pleural space — complication of untreated pneumonia.&lt;/li&gt;
    &lt;li&gt;Empyema Tx: chest tube drainage + IV antibiotics.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🩺 Thoracotomy &lt;span style=&quot;font-size:12px;color:#9af5c6&quot;&gt;(NEW)&lt;/span&gt;&lt;/h3&gt;
&lt;ul class=&quot;clean&quot;&gt;
  &lt;li&gt;Surgical opening into the chest wall (e.g., lobectomy, pneumonectomy, tumor/bleeding repair).&lt;/li&gt;
  &lt;li&gt;&lt;b&gt;Post-op priorities:&lt;/b&gt; airway &amp;amp; breathing first; pain control so the client will deep-breathe &amp;amp; cough; splint incision; incentive spirometry.&lt;/li&gt;
  &lt;li&gt;Chest tube usually in place — EXCEPT after a &lt;b&gt;pneumonectomy&lt;/b&gt;, where fluid is allowed to fill the empty space (often no suction; position per surgeon, often on the operative side / back).&lt;/li&gt;
  &lt;li&gt;Early ambulation; monitor drainage, watch for hemorrhage and subcutaneous emphysema.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;📦 3-Chamber Chest Drainage System &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot; style=&quot;grid-template-columns:1fr 1fr 1fr&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;① Drainage Collection&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Collects fluid/blood.&lt;/li&gt;&lt;li&gt;Mark &amp;amp; document hourly.&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;Report &amp;gt;70 mL/hr or cloudy/red.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;② Water Seal — 2 cm H₂O&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;One-way valve (no air back).&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;Tidaling = normal&lt;/span&gt; (lung re-expanding).&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;Continuous bubbling = AIR LEAK.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;③ Suction Control&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Controls suction level.&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;Gentle constant bubbling = expected.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;Vigorous bubbling = too much suction.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;table class=&quot;t&quot;&gt;
&lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Observation&lt;/th&gt;&lt;th&gt;Expected?&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Tidaling (rise/fall with breathing) in water seal&lt;/td&gt;&lt;td class=&quot;hl-g&quot;&gt;✅ Normal&lt;/td&gt;&lt;td&gt;Document; lung still re-expanding.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Gentle constant bubbling in SUCTION chamber&lt;/td&gt;&lt;td class=&quot;hl-g&quot;&gt;✅ Normal&lt;/td&gt;&lt;td&gt;Verify suction setting is correct.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Continuous bubbling in WATER SEAL chamber&lt;/td&gt;&lt;td class=&quot;hl-r&quot;&gt;❌ Air leak&lt;/td&gt;&lt;td&gt;Tighten all connections; notify provider.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;NO tidaling; no bubbling in water seal&lt;/td&gt;&lt;td class=&quot;hl&quot;&gt;⚠️ Check&lt;/td&gt;&lt;td&gt;Lung fully expanded (good) OR tube kinked (bad) → assess.&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Drainage &amp;gt;70 mL/hr or red/cloudy&lt;/td&gt;&lt;td class=&quot;hl-r&quot;&gt;⚠️ Report&lt;/td&gt;&lt;td&gt;Notify provider immediately.&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;
&lt;div class=&quot;dn&quot;&gt;
  &lt;div class=&quot;never&quot;&gt;&lt;span class=&quot;h&quot;&gt;❌ NEVER&lt;/span&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Clamp / strip / milk the tubing (unless specifically prescribed).&lt;/li&gt;
    &lt;li&gt;Raise the system above chest level.&lt;/li&gt;
    &lt;li&gt;Leave bedside without 2 hemostats, sterile water, occlusive dressing.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;do&quot;&gt;&lt;span class=&quot;h&quot;&gt;✅ ALWAYS&lt;/span&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Keep the system BELOW chest level.&lt;/li&gt;
    &lt;li&gt;Pre-removal: pain med 30 min before; Valsalva during removal.&lt;/li&gt;
    &lt;li&gt;Apply petroleum (occlusive) gauze dressing immediately after removal.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🤖 Mechanical Ventilation &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;ET Tube Placement Verification&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;End-tidal CO₂ (capnography)&lt;/b&gt; — immediate confirmation.&lt;/li&gt;
    &lt;li&gt;Bilateral breath sounds on auscultation.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;CXR = definitive&lt;/b&gt; (tube 2–3 cm above carina).&lt;/li&gt;
    &lt;li&gt;Cuff pressure 20–30 cm H₂O (same as tracheostomy).&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Ventilator Alarms — NEVER turn off&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Alarm&lt;/th&gt;&lt;th&gt;Cause&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;High pressure&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Secretions/mucus plug, bronchospasm, biting tube, kinked tubing, pneumothorax.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Low pressure&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Disconnection, cuff leak, tube pulled back.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;Apnea&lt;/b&gt;&lt;/td&gt;&lt;td&gt;No spontaneous breathing — emergency.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;PEEP&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Prevents alveolar collapse at end-expiration.&lt;/li&gt;
    &lt;li&gt;Normal 5–15 cm H₂O.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;High PEEP → pneumothorax risk&lt;/span&gt; (↑ intrathoracic pressure).&lt;/li&gt;
    &lt;li&gt;Used in: ARDS (primary), severe pneumonia, ARF.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Weaning Intolerance Signs&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;RR &amp;gt;30 or &amp;lt;8 /min.&lt;/li&gt;
    &lt;li&gt;BP or HR change &amp;gt;20% from baseline.&lt;/li&gt;
    &lt;li&gt;SaO₂ &amp;lt;90%.&lt;/li&gt;
    &lt;li&gt;Cardiac dysrhythmias; labored/distressed breathing.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🛡️ VAP Prevention Bundle&lt;/span&gt;
&lt;b&gt;HOB 30–45° at all times&lt;/b&gt; · oral care with chlorhexidine q2–4 hr · daily sedation vacations ·
daily weaning-readiness assessment · peptic-ulcer prophylaxis (PPI/H2 blocker) · DVT prophylaxis.&lt;/div&gt;
&lt;div class=&quot;box tip&quot;&gt;&lt;span class=&quot;bt&quot;&gt;💊 Sedation &amp;amp; Analgesia on the Vent&lt;/span&gt;
Sedation: propofol, midazolam, lorazepam · Analgesia: morphine, fentanyl. &lt;b&gt;Vecuronium/pancuronium PARALYZE ONLY&lt;/b&gt; —
always add sedation + analgesia simultaneously. Use the RASS scale to guide titration.&lt;/div&gt;&lt;a id=&quot;m6&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;module-banner mb-blue&quot;&gt;&lt;span class=&quot;ico&quot;&gt;🌬️&lt;/span&gt;
&lt;div&gt;&lt;h2&gt;Module 6 · Chronic Pulmonary Disease&lt;/h2&gt;
&lt;span class=&quot;tag&quot;&gt;COPD (emphysema &amp;amp; chronic bronchitis) · Breathing techniques · Asthma · Status asthmaticus · Lung cancer · Pulmonary embolism&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;objbox&quot;&gt;
&lt;div class=&quot;ob-h&quot;&gt;🎯 Module 6 — What You Must Be Able to Do&lt;/div&gt;
&lt;p class=&quot;ob-note&quot;&gt;From the Exam 2 Key Concepts review. These are the module objectives (course outcomes in parentheses) and the required topic list this module is expected to deliver.&lt;/p&gt;
&lt;div class=&quot;ob-sub&quot;&gt;Objectives&lt;/div&gt;
&lt;ol class=&quot;obj&quot;&gt;
&lt;li&gt;Define risk factors for the development of chronic respiratory disorders, lung cancer, and pulmonary embolism. &lt;span class=&quot;co&quot;&gt;(CO 1)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Describe the pathophysiology, clinical manifestations, and medical and nursing management of adult clients with asthma, lung cancer, and chronic pulmonary diseases. &lt;span class=&quot;co&quot;&gt;(CO 1, 2, 3, 4)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Develop an education plan for clients with asthma and chronic obstructive pulmonary disease. &lt;span class=&quot;co&quot;&gt;(CO 3)&lt;/span&gt;&lt;/li&gt;
&lt;li&gt;Use the nursing process as a framework for care of the client with pulmonary embolism. &lt;span class=&quot;co&quot;&gt;(CO 1, 2, 3, 4)&lt;/span&gt;&lt;/li&gt;
&lt;/ol&gt;
&lt;div class=&quot;ob-sub&quot;&gt;Topics Covered (Respiratory III)&lt;/div&gt;
&lt;div class=&quot;ob-topics&quot;&gt;
&lt;span class=&quot;tp&quot;&gt;Chronic obstructive pulmonary disease (COPD)&lt;/span&gt;
&lt;span class=&quot;tp&quot;&gt;Asthma&lt;/span&gt;
&lt;span class=&quot;tp&quot;&gt;Lung cancer&lt;/span&gt;
&lt;span class=&quot;tp&quot;&gt;Pulmonary embolism&lt;/span&gt;
&lt;/div&gt;
&lt;p class=&quot;ob-cross&quot;&gt;For every disorder, be ready to cover: causes/risk factors, pathophysiology, diagnostic procedures, clinical manifestations, medical management, nursing management &amp;amp; priorities of care, and client teaching. Remember: dosage calculation and NGN/alternate-format questions appear on every exam.&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;subhead&quot;&gt;🌬️ COPD &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🪷 Emphysema — &quot;Pink Puffer&quot;&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Alveolar wall destruction → loss of elasticity → air trapping → hyperinflation.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Dyspnea-dominant, barrel chest, clubbing, hyperresonance.&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;↓ Breath sounds; pursed-lip breathing to prolong expiration.&lt;/li&gt;
    &lt;li&gt;Cor pulmonale (late): right heart failure from pulmonary hypertension.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🔵 Chronic Bronchitis — &quot;Blue Bloater&quot;&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Inflamed bronchi → mucus hypersecretion → airflow obstruction.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Cyanosis, peripheral edema, productive cough.&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Productive cough WORST in the morning (secretions pool overnight).&lt;/li&gt;
    &lt;li&gt;CXR: &quot;dirty lung fields&quot; from chronic inflammation.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🔴 #1 COPD Risk Factor = Cigarette Smoking&lt;/span&gt;
Also: &lt;b&gt;alpha₁-antitrypsin (AAT) deficiency&lt;/b&gt; (genetic — affects young non-smokers → panacinar emphysema), air
pollution, occupational dust/chemicals, advanced age. &lt;b&gt;Smoking cessation is the single most important intervention.&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;COPD Medications&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Drug&lt;/th&gt;&lt;th&gt;Use&lt;/th&gt;&lt;th&gt;Side effects&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Albuterol (SABA)&lt;/td&gt;&lt;td&gt;Acute relief&lt;/td&gt;&lt;td&gt;Tremors, tachycardia&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Ipratropium (anticholinergic)&lt;/td&gt;&lt;td&gt;Maintenance&lt;/td&gt;&lt;td&gt;Dry mouth; palpitations = toxicity&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Theophylline&lt;/td&gt;&lt;td&gt;Maintenance&lt;/td&gt;&lt;td&gt;Narrow range! Toxicity: tachycardia, N/V/D&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Corticosteroids&lt;/td&gt;&lt;td&gt;Inflammation&lt;/td&gt;&lt;td&gt;Hyperglycemia, immunosuppression&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;COPD Diet &amp;amp; Activity&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;High-calorie, high-protein; 4–6 small meals&lt;/b&gt; (big meals → diaphragm pressure → dyspnea).&lt;/li&gt;
    &lt;li&gt;Fluids 2–3 L/day to thin secretions.&lt;/li&gt;
    &lt;li&gt;Schedule rest periods; pace activities.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;CAN use portable O₂ and leave home!&lt;/span&gt; (common misconception).&lt;/li&gt;
    &lt;li&gt;Allow morning bronchial secretions to clear first.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🫁 Breathing Techniques&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;💨 Pursed-Lip Breathing&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Inhale slowly through the &lt;b&gt;NOSE&lt;/b&gt; for 2 counts.&lt;/li&gt;
    &lt;li&gt;Purse lips as if to whistle.&lt;/li&gt;
    &lt;li&gt;Exhale SLOWLY through pursed lips for 4 counts.&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;hl-r&quot;&gt;Do NOT puff cheeks; do NOT rush exhale.&lt;/span&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p style=&quot;font-size:13.5px;color:#a99fc7;margin:6px 0 0&quot;&gt;Prolongs expiration → prevents air trapping → reduces CO₂ retention &amp;amp; dyspnea.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;🫁 Diaphragmatic Breathing&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;One hand on chest, one on abdomen.&lt;/li&gt;
    &lt;li&gt;Inhale through nose — &lt;b&gt;abdomen should RISE&lt;/b&gt; (not chest).&lt;/li&gt;
    &lt;li&gt;Exhale slowly; abdomen falls.&lt;/li&gt;
    &lt;li&gt;Chest hand should move minimally.&lt;/li&gt;
  &lt;/ul&gt;
  &lt;p style=&quot;font-size:13.5px;color:#a99fc7;margin:6px 0 0&quot;&gt;Promotes diaphragm use over accessory muscles → more efficient breathing.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — Pursed-Lip vs. Diaphragmatic&lt;/span&gt;
Pursed-lip = nose in, purse lips out (like whistling) → for air trapping/COPD. Diaphragmatic = hand on belly rises.
&quot;Place hand over stomach&quot; = diaphragmatic (NOT pursed-lip). &quot;Do not puff cheeks&quot; = pursed-lip only.&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🔥 Cor Pulmonale — late COPD complication&lt;/span&gt;
Right heart failure from chronic pulmonary hypertension. Signs: cyanosis, enlarged liver, &lt;b&gt;distended neck veins&lt;/b&gt;,
dependent (bilateral leg) edema. COPD → pulm. HTN → right heart strain → right heart failure → systemic venous congestion.&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🪷 Asthma &lt;span class=&quot;hi-pill&quot;&gt;High Yield&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🧬 Pathophysiology&lt;/span&gt;
Reversible airway obstruction: bronchoconstriction + mucosal edema + excess mucus → air trapping → wheeze → dyspnea.
Triggered → mast cells → histamine → inflammation. &lt;b&gt;Between attacks = normal airway.&lt;/b&gt;&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Triggers&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Cold air · allergens · smoke&lt;/li&gt;
    &lt;li&gt;Stress · exercise · NSAIDs/ASA&lt;/li&gt;
    &lt;li&gt;β-blockers · GERD · viral URIs&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Medications&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Drug&lt;/th&gt;&lt;th&gt;Use&lt;/th&gt;&lt;th&gt;Key points&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;SABA (albuterol)&lt;/td&gt;&lt;td class=&quot;hl-g&quot;&gt;ACUTE&lt;/td&gt;&lt;td&gt;First-line for an attack; bronchodilator FIRST; tremors/tachycardia.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;LABA (salmeterol)&lt;/td&gt;&lt;td class=&quot;hl-b&quot;&gt;PREVENTION&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl-r&quot;&gt;NEVER for acute attack&lt;/span&gt;; long-acting.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Prednisone&lt;/td&gt;&lt;td&gt;Inflammation&lt;/td&gt;&lt;td&gt;Take WITH food; don't stop suddenly; monitor glucose; black tarry stools = report.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;ICS (inhaled steroid)&lt;/td&gt;&lt;td&gt;Maintenance&lt;/td&gt;&lt;td&gt;Rinse mouth after (prevents thrush).&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⭐ ABG Danger Pattern in Asthma — know this&lt;/span&gt;
&lt;b&gt;Early attack:&lt;/b&gt; pH↑, PaCO₂ &amp;lt;35 (blowing off CO₂) = &lt;b&gt;respiratory alkalosis&lt;/b&gt;.
&lt;b&gt;Late / severe attack:&lt;/b&gt; pH↓, PaCO₂ &amp;gt;45 (fatiguing, hypoventilating) = &lt;b&gt;respiratory acidosis = respiratory failure imminent&lt;/b&gt;.
A &quot;normal&quot; PaCO₂ during an attack is actually a warning — they're getting tired.&lt;/div&gt;
&lt;div class=&quot;box mem&quot;&gt;&lt;span class=&quot;bt&quot;&gt;💨 Combo Inhaler Order&lt;/span&gt;
Bronchodilator FIRST (albuterol opens airways) → then the anti-inflammatory inhaler (now it penetrates deeper). Wait 1–2 minutes between puffs.&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ SNAP — Status Asthmaticus&lt;/span&gt;
Life-threatening bronchospasm not responsive to standard bronchodilators → &lt;b&gt;1.&lt;/b&gt; IV fluids &lt;b&gt;2.&lt;/b&gt; O₂ (high flow)
&lt;b&gt;3.&lt;/b&gt; IV bronchodilators &lt;b&gt;4.&lt;/b&gt; Epinephrine &lt;b&gt;5.&lt;/b&gt; IV steroids &lt;b&gt;6.&lt;/b&gt; Prepare for intubation. (Absent wheeze = airway too obstructed = danger.)&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🎖️ Lung Cancer&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Types&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;NSCLC&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Most common (80%). Squamous, adenocarcinoma, large cell. Slower growing.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;&lt;b&gt;SCLC&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Small cell — fast-growing, strongly smoking-linked, early metastasis.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;
  &lt;p style=&quot;font-size:13.5px;color:#a99fc7;margin:8px 0 0&quot;&gt;Surgery only for Stage I–II (no metastasis). Often diagnosed LATE → poor prognosis; 5-yr survival &amp;lt;20%.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Manifestations (usually LATE)&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Persistent cough with hemoptysis&lt;/span&gt; (most common presenting complaint).&lt;/li&gt;
    &lt;li&gt;Progressive hoarseness, dyspnea, chest pain.&lt;/li&gt;
    &lt;li&gt;Unexplained weight loss, fatigue, anorexia; finger clubbing.&lt;/li&gt;
    &lt;li&gt;Dx: CXR (first), CT, bronchoscopy, sputum cytology. Tx: chemo (cisplatin), radiation, targeted therapy.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box tip&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🛡️ Prevention &amp;amp; Screening&lt;/span&gt;
Smoking cessation (#1 priority) · annual low-dose CT for high-risk (age 50–80, ≥20 pack-year history, current or quit
&amp;lt;15 yr) · protective mask in hazardous environments (asbestos, radon, arsenic).&lt;/div&gt;
&lt;div class=&quot;subhead&quot;&gt;🩸 Pulmonary Embolism (PE) &lt;span class=&quot;hi-pill&quot;&gt;Critical Priority&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;box crit&quot;&gt;&lt;span class=&quot;bt&quot;&gt;🩸 Most common cause: DVT (usually a leg vein)&lt;/span&gt;
&lt;b&gt;Virchow's Triad:&lt;/b&gt; Stasis + Hypercoagulability + Vessel-wall injury → thrombus → travels to pulmonary vasculature → obstructs blood flow → V/Q mismatch → hypoxemia.&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Risk factors&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Immobility / prolonged bed rest.&lt;/li&gt;
    &lt;li&gt;OCP / estrogen therapy (NOT menopause alone).&lt;/li&gt;
    &lt;li&gt;Pregnancy; obesity (BMI ≥30); smoking.&lt;/li&gt;
    &lt;li&gt;Orthopedic surgery (hip/knee); chronic A-fib (clot formation).&lt;/li&gt;
    &lt;li&gt;Active cancer; hypercoagulability disorders; fractured femur (fat embolism + immobility).&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Clinical presentation&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl&quot;&gt;Sudden chest pain with inspiration + &quot;impending doom&quot; + dyspnea + anxiety.&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;Hemoptysis, tachycardia, tachypnea, hypotension.&lt;/li&gt;
    &lt;li&gt;Petechiae on chest/axillae (fat embolism); pleural friction rub; cyanosis.&lt;/li&gt;
    &lt;li&gt;ABG: early respiratory alkalosis (↓PaCO₂) → later acidosis.&lt;/li&gt;
    &lt;li&gt;D-dimer elevated (sensitive but NOT specific).&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box snap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;⚡ SNAP — PE Priority Actions (in order)&lt;/span&gt;
&lt;b&gt;1.&lt;/b&gt; OXYGEN FIRST (ABC — breathing before anticoagulation) &lt;b&gt;2.&lt;/b&gt; High-Fowler's &lt;b&gt;3.&lt;/b&gt; q30-min respiratory assessment
&lt;b&gt;4.&lt;/b&gt; Notify provider &lt;b&gt;5.&lt;/b&gt; IV heparin (aPTT monitoring) &lt;b&gt;6.&lt;/b&gt; MDCTA scan (criterion-standard diagnosis).&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;PE Treatment&lt;/h3&gt;
  &lt;table class=&quot;t&quot; style=&quot;margin:0&quot;&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;th&gt;Drug&lt;/th&gt;&lt;th&gt;Monitor&lt;/th&gt;&lt;th&gt;Contraindications&lt;/th&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Heparin (IV)&lt;/td&gt;&lt;td&gt;aPTT 60–100 sec&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;hl-r&quot;&gt;Peptic ulcer = immediate contraindication&lt;/span&gt; (GI bleed).&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Warfarin (PO)&lt;/td&gt;&lt;td&gt;PT/INR 2.0–3.0&lt;/td&gt;&lt;td&gt;Many drug/food interactions.&lt;/td&gt;&lt;/tr&gt;
  &lt;tr&gt;&lt;td&gt;Alteplase (tPA)&lt;/td&gt;&lt;td&gt;Fibrinogen&lt;/td&gt;&lt;td&gt;Recent surgery, uncontrolled HTN, active bleeding, recent stroke.&lt;/td&gt;&lt;/tr&gt;
  &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;PE Prevention&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;hl-g&quot;&gt;Early ambulation (most effective).&lt;/span&gt;&lt;/li&gt;
    &lt;li&gt;SCDs / compression stockings; leg exercises in bed.&lt;/li&gt;
    &lt;li&gt;Hydration (prevents blood viscosity).&lt;/li&gt;
    &lt;li&gt;Avoid prolonged sitting/immobility; DVT prophylaxis (LMWH).&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;box trap&quot;&gt;&lt;span class=&quot;bt&quot;&gt;😵 Exam Trap — PE Priority &amp;amp; Heparin Contraindication&lt;/span&gt;
PE priority = &lt;b&gt;OXYGEN FIRST&lt;/b&gt;, not heparin first, not CT first. ABC every time. If a client says &quot;I take antacids
several times a day for my ulcer&quot; → peptic ulcer disease = &lt;b&gt;contraindication to heparin&lt;/b&gt; (GI hemorrhage). A previous
DVT is NOT a contraindication — it's the reason for heparin.&lt;/div&gt;
&lt;a id=&quot;dosage&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;subhead&quot;&gt;🔢 Dosage Calc &amp;amp; NGN / Alternate-Format Reminder&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;Dosage Calculation&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;Every exam includes dosage calc — set up &lt;b&gt;Desired / Have × Quantity&lt;/b&gt; and label units.&lt;/li&gt;
    &lt;li&gt;Respiratory-relevant: O₂ flow rates, IV heparin drips (units/hr, weight-based), aminophylline/theophylline, antibiotic infusions.&lt;/li&gt;
    &lt;li&gt;Convert units first (mg↔g, mL↔L); double-check the decimal; round per facility rule.&lt;/li&gt;
    &lt;li&gt;For drip rates: &lt;b&gt;gtt/min = (volume × drop factor) / time in min.&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;NGN / Alternate-Format Items&lt;/h3&gt;
  &lt;ul class=&quot;clean&quot;&gt;
    &lt;li&gt;&lt;b&gt;SATA:&lt;/b&gt; treat each option as its own true/false; &quot;all that apply&quot; can be 1–all.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Priority / &quot;first&quot;:&lt;/b&gt; ABC → then assessment-before-action (nursing process).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Matrix / drag-and-drop:&lt;/b&gt; match findings to the condition; group expected vs. report.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Bow-tie:&lt;/b&gt; link the condition → priority actions → parameters to monitor.&lt;/li&gt;
    &lt;li&gt;Read for the &lt;b&gt;&quot;worst-first&quot;&lt;/b&gt; finding; pick what threatens airway/breathing/circulation soonest.&lt;/li&gt;
  &lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;a id=&quot;recall&quot;&gt;&lt;/a&gt;
&lt;div class=&quot;subhead&quot;&gt;⚡ Rapid Recall Grid — say these out loud&lt;/div&gt;
&lt;div class=&quot;qfire&quot;&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Venturi mask&lt;/b&gt; = most precise FiO₂; best for COPD; 24–60%.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Non-rebreather&lt;/b&gt; = highest FiO₂ without intubation; 80–95%; check valve hourly.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;COPD O₂ target&lt;/b&gt; = 88–92% (NOT 95–100%); hypoxic drive.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Chest tube&lt;/b&gt; = keep BELOW chest; tidaling normal; continuous water-seal bubbling = air leak.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;TB isolation&lt;/b&gt; = negative-pressure room + N95 for staff + surgical mask on client.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Tension PTX&lt;/b&gt; = trachea deviates to UNAFFECTED side + JVD + shock → needle decompression FIRST.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;PE priority&lt;/b&gt; = OXYGEN first, not heparin; MDCTA = standard diagnosis.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Vecuronium&lt;/b&gt; paralyzes — does NOT sedate; add sedative + analgesic.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;VAP prevention&lt;/b&gt; = HOB 30–45°, oral care q2–4 hr, daily wean assessment.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;SABA vs LABA&lt;/b&gt; = SABA acute relief; LABA prevention only — never LABA for an attack.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Ethambutol&lt;/b&gt; = Eyes; STOP immediately on vision changes; monthly vision test.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Sputum culture&lt;/b&gt; BEFORE antibiotics — always (pneumonia &amp;amp; TB).&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;ABC always first&lt;/b&gt; — O₂ before heparin, before CT, before calling provider.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Assessment before action&lt;/b&gt; when data is only subjective.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;Epistaxis&lt;/b&gt; = lean FORWARD, pinch the soft part 10–15 min.&lt;/div&gt;
  &lt;div class=&quot;qf&quot;&gt;&lt;b&gt;No wheezing&lt;/b&gt; in a severe asthmatic = DANGER (airway too obstructed).&lt;/div&gt;
&lt;/div&gt;

&lt;html lang=&quot;en&quot;&gt;&lt;head&gt;&lt;meta http-equiv=&quot;Content-Type&quot; content=&quot;text/html; charset=UTF-8&quot;&gt;

&lt;title&gt;NUR 198 · ATI Complete Study Set · Modules 4–6&lt;/title&gt;
&lt;style&gt;
/* ===== Plum / purple-magenta theme — large fonts, high contrast, ADHD-friendly ===== */
:root{
  --bg0:#2a0e3a;        /* deep plum (top) */
  --bg1:#3a1248;        /* plum */
  --lav:#4a1a55;        /* plum-magenta mid */
  --pink:#6e1a52;       /* deep magenta */
  --card:#3a1a4d;       /* card surface */
  --card2:#481f5e;      /* raised header surface */
  --field:#2d1140;      /* fill-in box surface (darker) */
  --ink:#fceefb;        /* near-white, slight warm */
  --ink-soft:#e6cdec;
  --muted:#c19fce;
  --gold:#ffcf5c;
  --gold-soft:#ffe49b;
  --green:#6ff0b0;
  --green-soft:#a8f7cf;
  --red:#ff8a98;
  --blue:#8fc0ff;
  --teal:#5fe0d2;
  --violet:#cfa0ff;
  --magenta:#ff8ad9;
  --orange:#ffb070;
  --line:#6a3d7e;
  --line-soft:#553066;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:&quot;Segoe UI&quot;,system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:17px;
  line-height:1.6;
  color:var(--ink);
  background:
    linear-gradient(180deg,
      var(--bg0) 0%, var(--bg1) 10%, var(--lav) 26%, var(--pink) 50%,
      var(--lav) 74%, var(--bg0) 100%);
  background-attachment:fixed;
}
.wrap{max-width:1080px;margin:0 auto;padding:30px 22px 90px;}

/* ---- Top banner ---- */
.top{
  background:linear-gradient(135deg, rgba(110,26,82,.92), rgba(74,26,85,.92));
  border:1px solid var(--line);border-radius:22px;
  padding:30px 30px;margin-bottom:22px;text-align:center;
  box-shadow:0 10px 34px rgba(0,0,0,.45);
}
.top h1{margin:0 0 6px;font-size:34px;font-weight:800;color:#fff;letter-spacing:.4px;}
.top .sub{font-size:19px;color:var(--gold-soft);font-weight:700;margin-bottom:14px;}
.top .who{font-size:15px;color:var(--ink-soft);}
.chipbar{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:16px;}
.chip{
  font-size:14.5px;background:rgba(143,192,255,.14);color:var(--ink);
  border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:600;
}
.chip a{color:var(--ink);text-decoration:none;}
.chip:hover{background:rgba(143,192,255,.28);}

/* ---- How-to note ---- */
.howto{
  background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);
  border-radius:14px;padding:16px 20px;margin-bottom:30px;font-size:15.5px;color:var(--ink-soft);
}
.howto b{color:var(--gold-soft);}

/* ---- Template card (one ATI sheet) ---- */
.tmpl{
  background:rgba(45,17,64,.55);
  border:1px solid var(--line);
  border-radius:20px;padding:24px 24px 28px;margin:0 0 40px;
  box-shadow:0 8px 26px rgba(0,0,0,.40);
  scroll-margin-top:14px;
}
/* template title bar (mimics ATI header strip) */
.tbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border-bottom:3px solid var(--magenta);padding-bottom:14px;margin-bottom:6px;
}
.tbar .kind{font-size:14px;font-weight:800;letter-spacing:1.5px;color:var(--magenta);text-transform:uppercase;}
.tbar h2{margin:0;font-size:30px;font-weight:800;color:#fff;font-style:italic;flex:1;min-width:240px;}
.tbar .ic{width:54px;height:54px;flex:0 0 auto;}
.tbar .ic img{width:100%;height:100%;}

/* the &quot;form fields&quot; row (student/topic/chapter) */
.fields{display:flex;flex-wrap:wrap;gap:10px 26px;margin:14px 0 20px;font-size:15px;}
.fields .f{color:var(--muted);font-weight:700;letter-spacing:.4px;}
.fields .f span{color:var(--ink);font-weight:600;letter-spacing:0;}

/* group label (CONSIDERATIONS / ASSESSMENT etc.) */
.glabel{font-size:13.5px;font-weight:800;letter-spacing:1.4px;color:var(--gold);
  text-transform:uppercase;margin:18px 0 8px;}
.gbox{background:rgba(72,31,94,.40);border:1px dashed var(--line);border-radius:14px;padding:12px 12px 4px;margin-bottom:8px;}

/* a labeled box (each ATI cell) */
.box{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  margin:0 0 14px;overflow:hidden;
}
.box &gt; .h{
  background:var(--card2);color:var(--gold-soft);font-weight:800;font-size:16.5px;
  padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
}
.box &gt; .h .ti{width:22px;height:22px;flex:0 0 auto;opacity:.95;}
.box &gt; .h .ti img{width:100%;height:100%;}
.box .c{padding:14px 16px 6px;font-size:16px;}
.box.full{}
.box.wide{}

/* full-width description box gets a distinct top accent */
.box.desc &gt; .h{background:linear-gradient(100deg,#8e2d6b,#b8478a);color:#fff;}

ul.clean{margin:4px 0 12px;padding-left:22px;}
ul.clean li{margin:7px 0;}
ul.clean li::marker{color:var(--magenta);}
.k{color:var(--gold);font-weight:700;}        /* key term highlight */
.kr{color:var(--red);font-weight:700;}
.kg{color:var(--green-soft);font-weight:700;}
.kb{color:var(--blue);font-weight:700;}
.kt{color:var(--teal);font-weight:700;}

/* little inline pill for &quot;exam trap&quot;/&quot;memory&quot; tags */
.tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 8px;border-radius:11px;vertical-align:middle;margin-left:6px;}
.tag.trap{background:var(--orange);color:#3a1a00;}
.tag.mem{background:var(--blue);color:#0a1a3a;}
.tag.new{background:var(--green);color:#06311e;}

/* highlighted call-out line inside a box */
.callout{
  background:rgba(255,138,217,.12);border-left:5px solid var(--magenta);
  border-radius:8px;padding:9px 13px;margin:6px 0 12px;font-size:15.5px;color:var(--ink);
}
.callout.trap{background:rgba(255,176,112,.13);border-color:var(--orange);}
.callout.trap b{color:var(--orange);}
.callout.safe{background:rgba(111,240,176,.12);border-color:var(--green);}
.callout.safe b{color:var(--green-soft);}
.callout b{color:var(--magenta);}

/* grid layouts mimicking ATI arrangement */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr;}}

/* SVG illustration block */
.illus{display:flex;justify-content:center;margin:8px 0 4px;}
.illus svg{max-width:100%;height:auto;}
.cap{font-size:13px;color:var(--muted);text-align:center;font-style:italic;margin:2px 0 10px;}

/* TOC */
.toc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin-bottom:30px;}
.toc h3{margin:0 0 10px;font-size:18px;color:var(--gold);}
.toc a{display:inline-block;color:var(--blue);text-decoration:none;font-size:15.5px;
  padding:6px 14px;margin:5px 7px 5px 0;border:1px solid var(--line);border-radius:20px;background:rgba(143,192,255,.08);}
.toc a:hover{background:rgba(143,192,255,.22);}

.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:24px;}
&lt;/style&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Short-Acting Bronchodilators (Rescue)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Short-Acting Bronchodilators (Rescue)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Albuterol (SABA) · Levalbuterol · Ipratropium (SAMA) · Combivent (albuterol+ipratropium)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;SABA: stimulate beta₂ receptors → relax bronchial smooth muscle (fast).&lt;/li&gt;&lt;li&gt;SAMA (ipratropium): block acetylcholine → less bronchoconstriction &amp;amp; secretions.&lt;/li&gt;&lt;li&gt;Onset in minutes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Acute asthma attack / bronchospasm (rescue).&lt;/li&gt;&lt;li&gt;COPD exacerbation.&lt;/li&gt;&lt;li&gt;Pre-treat exercise-induced bronchospasm (15–30 min before).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Tachycardia, palpitations, tremor, nervousness.&lt;/li&gt;&lt;li&gt;Ipratropium: dry mouth, blurred vision if sprayed in eyes.&lt;/li&gt;&lt;li&gt;Overuse → tolerance, paradoxical bronchospasm.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Shake MDI; use a spacer; inhale slow &amp;amp; deep, hold ~10 sec.&lt;/li&gt;&lt;li&gt;BRONCHODILATOR BEFORE corticosteroid inhaler; wait ~1 min between puffs.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Caution: cardiac disease, dysrhythmias, HTN, hyperthyroidism.&lt;/li&gt;&lt;li&gt;Ipratropium: caution in narrow-angle glaucoma, BPH.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Beta-blockers blunt SABA effect.&lt;/li&gt;&lt;li&gt;Other sympathomimetics → additive cardiac stimulation.&lt;/li&gt;&lt;li&gt;Watch hypokalemia with diuretics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rescue, NOT daily control — frequent use = poor control, tell provider.&lt;/li&gt;&lt;li&gt;No wheezing in a severe attack = EMERGENCY.&lt;/li&gt;&lt;li&gt;Report chest pain/palpitations or no relief.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Easier breathing, fewer wheezes, ↑ SpO₂ &amp;amp; peak flow, speaks in full sentences.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; Albuterol is RESCUE; reaching for it daily means the asthma isn’t controlled. Don’t confuse with the long-acting controllers.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-laba&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Long-Acting Bronchodilators (Controllers)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Long-Acting Bronchodilators (Controllers)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Salmeterol (LABA) · Formoterol (LABA) · Tiotropium (LAMA) · Combos (e.g., fluticasone+salmeterol)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;LABA: prolonged beta₂ stimulation → sustained bronchodilation (~12 hr).&lt;/li&gt;&lt;li&gt;LAMA (tiotropium): long-acting anticholinergic, once daily.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Maintenance therapy in asthma (always WITH an inhaled steroid) and COPD.&lt;/li&gt;&lt;li&gt;Reduce frequency of exacerbations.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Tachycardia, tremor, headache.&lt;/li&gt;&lt;li&gt;LABA monotherapy in asthma → ↑ risk of severe events (must pair with ICS).&lt;/li&gt;&lt;li&gt;Tiotropium: dry mouth.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Scheduled dosing (daily), NOT PRN.&lt;/li&gt;&lt;li&gt;Tiotropium often a DPI capsule — do NOT swallow the capsule.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;NEVER use a LABA alone for asthma.&lt;/li&gt;&lt;li&gt;Caution: cardiac disease, narrow-angle glaucoma (LAMA), BPH.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Beta-blockers antagonize.&lt;/li&gt;&lt;li&gt;Additive effects with other sympathomimetics.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;For PREVENTION only — keep a separate rescue inhaler for attacks.&lt;/li&gt;&lt;li&gt;Use every day even when feeling well.&lt;/li&gt;&lt;li&gt;Rinse mouth after combo steroid inhalers.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Fewer attacks, better daily breathing, improved activity tolerance.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; EXAM TRAP — a LABA (salmeterol) during an acute attack is a WRONG answer. Long-acting = prevention; never the rescue.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-ics&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Inhaled Corticosteroids (ICS)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Inhaled Corticosteroids (ICS)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Fluticasone · Budesonide · Beclomethasone · Mometasone&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Suppress inflammatory response in airways → less swelling, mucus, reactivity.&lt;/li&gt;&lt;li&gt;Takes days–weeks for full effect.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Daily maintenance of persistent asthma; COPD (often in combos).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Oral candidiasis (thrush), hoarseness, throat irritation.&lt;/li&gt;&lt;li&gt;Long-term/high-dose systemic: ↑ infection risk, bone loss, hyperglycemia.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Use AFTER the bronchodilator.&lt;/li&gt;&lt;li&gt;RINSE MOUTH / gargle after each use (prevents thrush).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Not for acute attacks.&lt;/li&gt;&lt;li&gt;Caution with active oral/respiratory infection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Few inhaled; systemic steroids → ↑ glucose, K⁺ loss.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Take daily even when well — it prevents, doesn’t rescue.&lt;/li&gt;&lt;li&gt;Rinse mouth every time; use a spacer.&lt;/li&gt;&lt;li&gt;Don’t stop abruptly if systemic.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Fewer symptoms/attacks over time, improved peak flow, less rescue use.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; The mouth-rinse step is a classic test point — it’s the steroid (not albuterol) that causes thrush.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-controllers&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Other Asthma Controllers&lt;/h2&gt;&lt;/div&gt;

      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Other Asthma Controllers&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Montelukast (leukotriene modifier) · Cromolyn (mast-cell stabilizer) · Omalizumab (anti-IgE) · Theophylline (methylxanthine)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Montelukast: blocks leukotrienes → less inflammation/bronchoconstriction.&lt;/li&gt;&lt;li&gt;Cromolyn: stabilizes mast cells → prevents release of histamine.&lt;/li&gt;&lt;li&gt;Omalizumab: binds IgE (severe allergic asthma), given SubQ.&lt;/li&gt;&lt;li&gt;Theophylline: bronchodilation + mild anti-inflammatory.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Montelukast: prophylaxis, exercise-induced, allergic asthma.&lt;/li&gt;&lt;li&gt;Cromolyn: prophylaxis (NOT acute).&lt;/li&gt;&lt;li&gt;Theophylline: maintenance when others insufficient.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Montelukast: HEADACHE; mood/behavior changes — report depression/suicidal thoughts.&lt;/li&gt;&lt;li&gt;Theophylline: NARROW therapeutic range; toxicity = N/V, tachycardia, seizures.&lt;/li&gt;&lt;li&gt;Omalizumab: risk of anaphylaxis after injection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Montelukast: once daily, EVENING dosing.&lt;/li&gt;&lt;li&gt;Theophylline: take around the clock; check levels.&lt;/li&gt;&lt;li&gt;Omalizumab: monitor 2 hr post-injection.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Cromolyn/montelukast not for acute attacks.&lt;/li&gt;&lt;li&gt;Theophylline caution: cardiac, seizure disorders.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Theophylline: caffeine ↑ effect; smoking ↓ levels; many drug interactions.&lt;/li&gt;&lt;li&gt;Monitor theophylline level 10–20 mcg/mL.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Montelukast prevents — keep a rescue inhaler.&lt;/li&gt;&lt;li&gt;Theophylline: avoid caffeine; report nausea, palpitations.&lt;/li&gt;&lt;li&gt;Report mood changes with montelukast.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; Fewer/less severe attacks; theophylline level in therapeutic range.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; Theophylline toxicity (&amp;gt;20) shows up as N/V, tachycardia, and seizures — a frequent question.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-ripe&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;

      &lt;div&gt;&lt;div class=&quot;kind&quot;&gt;Active Learning Template · Medication Class&lt;/div&gt;&lt;h2&gt;Anti-Tuberculosis (RIPE)&lt;/h2&gt;&lt;/div&gt;
    &lt;/div&gt;&lt;div class=&quot;fields&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;CLASS: &lt;span&gt;Anti-Tuberculosis (RIPE)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;f&quot;&gt;REVIEW: &lt;span&gt;NUR 198 Exam 2 · Mod 4–6&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;fields&quot; style=&quot;margin-top:-8px;&quot;&gt;
      &lt;div class=&quot;f&quot;&gt;DRUGS IN THIS CLASS: &lt;span&gt;Rifampin · Isoniazid (INH) · Pyrazinamide · Ethambutol&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Purpose of Medication&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Expected Pharmacological Action&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Bactericidal/bacteriostatic against Mycobacterium tuberculosis.&lt;/li&gt;&lt;li&gt;Combination therapy 6–12 months.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Therapeutic Use&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Active pulmonary TB; latent TB (often INH alone).&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Complications (adverse effects)&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rifampin: ORANGE body fluids (harmless), hepatotoxic, ↓ contraceptive effect.&lt;/li&gt;&lt;li&gt;Isoniazid: peripheral neuropathy (give B6), hepatotoxic.&lt;/li&gt;&lt;li&gt;Pyrazinamide: ↑ uric acid (gout), joint pain, hepatotoxic.&lt;/li&gt;&lt;li&gt;Ethambutol: OPTIC neuritis — vision &amp;amp; color changes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Medication Administration&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Take on empty stomach if tolerated; consistent daily dosing.&lt;/li&gt;&lt;li&gt;Directly Observed Therapy (DOT) to ensure adherence.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Contraindications / Precautions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;All hepatotoxic — caution in liver disease; NO alcohol.&lt;/li&gt;&lt;li&gt;Ethambutol caution if can’t report vision changes.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Interactions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Rifampin induces liver enzymes → ↓ many drugs (warfarin, OCPs, etc.).&lt;/li&gt;&lt;li&gt;INH → ↑ phenytoin levels.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;glabel&quot;&gt;Considerations&lt;/div&gt;&lt;div class=&quot;gbox&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Nursing Interventions&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Assess lung sounds, RR, SpO₂/relevant labs before &amp;amp; after.&lt;/li&gt;&lt;li&gt;Monitor for the adverse effects above.&lt;/li&gt;&lt;li&gt;Confirm correct administration/technique each time.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Client Education&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;ul class=&quot;clean&quot;&gt;&lt;li&gt;Finish the ENTIRE course (months) — stopping breeds resistant TB.&lt;/li&gt;&lt;li&gt;Rifampin turns urine/tears orange (may stain contacts).&lt;/li&gt;&lt;li&gt;Ethambutol: report ANY vision change immediately.&lt;/li&gt;&lt;li&gt;Use non-hormonal backup contraception; avoid alcohol.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;Evaluation of Medication Effectiveness&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout safe&quot;&gt;&lt;b&gt;Effective when:&lt;/b&gt; 3 consecutive negative sputum cultures = no longer infectious; symptoms resolve.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;box &quot;&gt;&lt;div class=&quot;h&quot;&gt;⚠ Exam Trap / Key Point&lt;/div&gt;&lt;div class=&quot;c&quot;&gt;&lt;div class=&quot;callout trap&quot;&gt;&lt;b&gt;REMEMBER —&lt;/b&gt; Ethambutol = Eyes (“RIP Eyes”). Vision change → STOP the drug. Orange fluids from rifampin are EXPECTED, not a reason to stop.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tmpl&quot; id=&quot;med-anticoag&quot;&gt;&lt;div class=&quot;tbar&quot;&gt;
